  $('#qCount').textContent = i < QN ? 'שאלה ' + (i + 1) + ' מתוך ' + QN : 'נשאר רק לאן לשלוח';
  var q = Q[i], h = '';
  if (i === 0 && PROPS[prop]) h += '<div class="q-ctx"><img src="img/' + prop + '/1.jpg" alt="" onerror="this.remove()"><span>' + ctxLine(PROPS[prop].t) + '</span></div>';
  if (q.type === 'one') {
    h += '<h1 class="q-ttl">' + esc(q.t) + '</h1>' + (q.s ? '<div class="q-sub">' + esc(q.s) + '</div>' : '') + '<div class="opts" role="radiogroup" aria-label="' + esc(q.t) + '">'
      + q.o.map(function(o){ var on = J.a[q.id] === o[0]; return '<button type="button" class="opt' + (on ? ' sel' : '') + '" role="radio" aria-checked="' + on + '" data-v="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>';
    step(q.id);
  } else if (q.type === 'many') {
    h += '<h1 class="q-ttl">' + esc(q.t) + '</h1><div class="q-sub">' + esc(q.s) + '</div><div class="chips">'
      + q.o.map(function(o){ var on = J.a.must.indexOf(o[0]) >= 0; return '<button type="button" class="chip' + (o[0] === 'none' ? ' wide' : '') + (on ? ' sel' : '') + '" data-m="' + o[0] + '" aria-pressed="' + on + '">' + o[1] + '</button>'; }).join('')
      + '</div><div class="spacer"></div><button type="button" class="qbtn" id="mustNext"' + (J.a.must.length ? '' : ' disabled') + '>המשך</button>';
    step('must');
  } else {
    h += '<h1 class="q-ttl">' + esc(QC.contactT || 'לאן לשלוח לכם את הדירות שמתאימות?') + '</h1><div class="q-sub">' + esc(QC.contactS || 'נשלח לכם בוואטסאפ דירות שעונות על מה שסימנתם, ורז מהצוות של תום יחזור אליכם.') + '</div>'
      + '<form id="cform" novalidate autocomplete="on">'
      + '<div class="fld"><label for="fName">שם מלא</label><input id="fName" name="name" autocomplete="name" enterkeyhint="next" value="' + esc(J.a.name || '') + '"></div>'
      + '<div class="fld"><label for="fPhone">טלפון נייד</label><input id="fPhone" name="tel" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" style="text-align:right" enterkeyhint="send" value="' + esc(J.a.phone || '') + '"></div>'
      + '<label class="consent"><input type="checkbox" id="fConsent"' + (J.a.consent ? ' checked' : '') + '><span>' + esc(CONSENT) + '</span></label>'
      + '<div class="err" id="fErr" role="alert"></div>'
      + '</form><div class="spacer"></div><button type="button" class="qbtn" id="fSend">' + esc(SEND) + '</button>';
    step('contact');
  }
  $('#qbody').innerHTML = '<div class="q-step ' + (dir || '') + '">' + h + '</div>';
  var f = $('.q-ttl', $('#qbody')); if (f && dir) { f.setAttribute('tabindex', '-1'); f.focus({ preventScroll: true }); }
}
/* אירוע פיקסל אחד כשעוברים את השאלה הראשונה, לקהל "התחילו ולא השאירו פרטים" (גל 05/11). במצב בדיקה fbq ריק */
function started(){ if (sent._start) return; sent._start = 1; try { if (window.fbq) fbq('trackCustom', 'QuizStart', { content_name: 'yad2_' + (prop || 'direct') }); } catch (e) {} }
function next(){ J.hist.push(J.i); if (J.i === 0) started(); go(J.i + 1, 'fwd'); }

$('#qbody').addEventListener('click', function(e){
  var opt = e.target.closest('.opt');
  if (opt) {
    var q = Q[J.i], v = opt.dataset.v;
    $$('.opt', $('#qbody')).forEach(function(o){ o.classList.toggle('sel', o === opt); o.setAttribute('aria-checked', o === opt); });
    J.a[q.id] = v;
    setTimeout(function(){ if (q.id === 'area' && v === 'other') return outOfArea(); next(); }, 240);
    return;
  }
  var chip = e.target.closest('.chip');
  if (chip) {
    var m = J.a.must, k = chip.dataset.m;
    if (k === 'none') m = m.indexOf('none') >= 0 ? [] : ['none'];
    else { m = m.filter(function(x){ return x !== 'none'; }); m = m.indexOf(k) >= 0 ? m.filter(function(x){ return x !== k; }) : m.concat([k]); }
    J.a.must = m;
    $$('.chip', $('#qbody')).forEach(function(c){ var on = m.indexOf(c.dataset.m) >= 0; c.classList.toggle('sel', on); c.setAttribute('aria-pressed', on); });
    $('#mustNext').disabled = !m.length;
    return;
  }
  if (e.target.id === 'mustNext') { next(); return; }
  if (e.target.id === 'fConsent' && e.target.checked) { $('.consent').classList.remove('need'); $('#fErr').textContent = ''; }
  if (e.target.id === 'fSend') { submit(); return; }
  if (e.target.id === 'refSend') { referral(); return; }
  if (e.target.closest('.again')) { back(); return; }
});
$('#qbody').addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  if (e.target.id === 'fName') { e.preventDefault(); $('#fPhone').focus(); }
  else if (e.target.id === 'fPhone') { e.preventDefault(); submit(); }
  else if (e.target.id === 'rName') { e.preventDefault(); $('#rPhone').focus(); }
  else if (e.target.id === 'rPhone') { e.preventDefault(); referral(); }
});
$('#qbody').addEventListener('input', function(e){
  if (e.target.id === 'fName') J.a.name = e.target.value;
  if (e.target.id === 'fPhone') J.a.phone = e.target.value;
});
$('#qbody').addEventListener('change', function(e){ if (e.target.id === 'fConsent') J.a.consent = e.target.checked; });
$('#qBack').addEventListener('click', back);

function back(){
  if (J.done || J.busy) return;
  if (J.out) { J.out = false; go(0, 'bwd'); return; }
  if (!J.hist.length) return;
  go(J.hist.pop(), 'bwd');
}
function phoneDigits(v){ var d = String(v || '').replace(/\D/g, ''); if (d.indexOf('972') === 0) d = '0' + d.slice(3); return d; }

function outOfArea(){
  J.out = true; step('other');
  $('#qBack').classList.remove('off');
  $('#qCount').textContent = '';
  $('#qbody').innerHTML = '<div class="q-step fwd out"><span class="ic">' + PIN + '</span>'
    + '<h1 style="font-size:26px;font-weight:800;line-height:1.2">' + esc(QC.otherT || 'מחפשים באזור אחר?') + '</h1><p>' + esc(QC.otherS || 'הצוות של תום עובד ברמת גן, גבעתיים ותל אביב. באזורים אחרים נעביר אתכם למתווך שאנחנו סומכים עליו.') + '</p>'
    + '<form id="rform" novalidate autocomplete="on">'
    + '<div class="fld"><label for="rName">שם</label><input id="rName" name="name" autocomplete="name"></div>'
    + '<div class="fld"><label for="rArea">באיזה אזור אתם מחפשים?</label><input id="rArea" name="area" autocomplete="address-level2" placeholder="למשל ראשון לציון"></div>'
    + '<div class="fld"><label for="rPhone">טלפון נייד</label><input id="rPhone" name="tel" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" style="text-align:right"></div>'
    + '<div class="err" id="rErr" role="alert"></div></form>'
    + '<button type="button" class="qbtn" id="refSend">' + esc(OTHER_BTN) + '</button>'
    + '<button type="button" class="again">סימנתי בטעות, חזרה לשאלה</button></div>';
}

function post(path, body, tries){
  return fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(body), keepalive: true })
    .then(function(r){ return r.json().then(function(j){ if (!r.ok || !j.ok) { var er = new Error(j.error || ('http ' + r.status)); er.http = r.status; throw er; } return j; }); })
    .catch(function(err){ if ((tries || 0) < 2 && !(err.http >= 400 && err.http < 500)) return new Promise(function(res){ setTimeout(res, 900 * ((tries || 0) + 1)); }).then(function(){ return post(path, body, (tries || 0) + 1); }); throw err; });
}

function referral(){
  if (J.busy) return;
  var n = $('#rName').value.trim(), d = phoneDigits($('#rPhone').value), area = $('#rArea').value.trim();
  if (n.length < 2) { $('#rErr').textContent = 'חסר שם. אפשר שם פרטי בלבד.'; $('#rName').focus(); return; }
  if (!/^05\d{8}$/.test(d)) { $('#rErr').textContent = 'צריך מספר נייד ישראלי, 10 ספרות שמתחילות ב־05.'; $('#rPhone').focus(); return; }
  J.busy = true; var b = $('#refSend'); b.classList.add('busy'); b.textContent = 'שולח...';
  post('/yad2/referral', { name: n, phone: d, area: area, prop: prop, utm: utm }).then(function(){
    J.done = true; step('other_done');
    $('#qBack').classList.add('off');
    var f = n.split(/\s+/)[0];
    $('#qbody').innerHTML = '<div class="q-step fwd ty"><span class="ok">' + CHECK + '</span><h1 style="font-size:26px;font-weight:800">' + esc(nameIn(QC.otherTyT || 'תודה, {שם}', f)) + '</h1><p>' + esc(QC.otherTyS || 'נעביר את הפרטים שלכם למתווך באזור שלכם, והוא יחזור אליכם.') + '</p></div>';
  }).catch(function(){
    J.busy = false; b.classList.remove('busy'); b.textContent = OTHER_BTN;
    $('#rErr').textContent = 'לא הצלחנו לשלוח כרגע. בדקו את החיבור ונסו שוב.';
  });
}

function submit(){
  if (J.busy) return;
  var n = $('#fName').value.trim(), d = phoneDigits($('#fPhone').value), c = $('#fConsent').checked, err = $('#fErr');
  if (n.length < 2) { err.textContent = 'חסר שם. אפשר שם פרטי בלבד.'; $('#fName').focus(); return; }
  if (!/^05\d{8}$/.test(d)) { err.textContent = 'צריך מספר נייד ישראלי, 10 ספרות שמתחילות ב־05.'; $('#fPhone').focus(); return; }
  if (!c) { err.textContent = QC.errConsent || 'כדי שנוכל לשלוח לכם את הדירות בוואטסאפ, צריך לסמן את האישור.'; $('.consent').classList.add('need'); return; }
  J.busy = true; var b = $('#fSend'); b.classList.add('busy'); b.textContent = 'שולח...';
  var a = J.a, EID = 'y2' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  var body = { name: n, phone: d, area: a.area, rooms: a.rooms, budget: a.budget, must: a.must.filter(function(x){ return x !== 'none'; }), prop: prop, utm: utm,
    consent: true, consentText: CONSENT, event_id: EID, fbp: ck('_fbp'), fbc: fbc(), page_url: location.href.split('#')[0].slice(0, 300), ref_url: document.referrer.slice(0, 300) };
  post('/yad2/lead', body).then(function(j){
    J.done = true; step('done');
    try { if (window.fbq) fbq('track', 'Lead', { content_name: 'yad2_' + (prop || 'direct'), content_category: a.area }, { eventID: EID }); } catch (e) {}
    thanks(n.split(/\s+/)[0], j);
  }).catch(function(){
    J.busy = false; b.classList.remove('busy'); b.textContent = SEND;
    err.textContent = 'לא הצלחנו לשלוח כרגע. בדקו את החיבור ונסו שוב.';
  });
}

/* ── דף התודה לפי שעון ישראל (גל 10/11, השעות של רז מהזום) ──
   שבת: שישי 16:00 עד מוצאי שבת 19:00 = "ביום ראשון בבוקר". לילה: 22:00 עד 08:00 = "בבוקר". אחרת: "בשעה הקרובה".
   מה נשלח בוואטסאפ לפי מה שהשרת החזיר: sent = נשלח עכשיו, pending = יוצא ב־08:00 (מחוץ לחלון השליחה). אחרת לא מבטיחים. */
function ilNow(){
  var o = {};
  try { new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Jerusalem', weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date()).forEach(function(p){ o[p.type] = p.value; }); } catch (e) {}
  var d = new Date(); return { d: o.weekday || ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()], h: o.hour != null ? +o.hour % 24 : d.getHours(), m: o.minute != null ? +o.minute : d.getMinutes() };
}
function tyWhen(){
  var t = ilNow(), hm = t.h * 60 + t.m;
  if ((t.d === 'Fri' && hm >= 16 * 60) || (t.d === 'Sat' && hm < 19 * 60)) return 'shabbat';
  return (t.h >= 22 || t.h < 8) ? 'night' : 'day';
}
function thanks(first, j){
  progress(QN + 1);
  $('#qBack').classList.add('off');
  $('#qCount').textContent = '';
  var when = tyWhen(), wa = j.wa || '';
  var call = when === 'shabbat' ? (TY.callShabbat || TY.call) : when === 'night' ? (TY.callNight || TY.call) : TY.call;
  var lines = [];
  if (j.single) {   // הגיע ממודעה של נכס שבמלאי: עמוד הנכס
    if (wa === 'sent') lines.push(TY.sent); else if (wa === 'pending') lines.push(TY.night);
    lines.push(call);
  } else {          // בלי נכס: "קיבלנו את מה שחיפשת", וההבטחה לשיחה לפי השעה (המשפט של ty.call בתוך ty.noprop מוחלף בגרסת הלילה / השבת)
    var np = TY.noprop || '', base = String(TY.call || '').replace(/\.\s*$/, ''), alt = String(call || '').replace(/\.\s*$/, '');
    lines.push(base && alt && np.indexOf(base) >= 0 ? np.replace(base, alt) : np);
  }
  var btn = j.single && j.code && TY.btn ? '<a class="see" href="m/?c=' + encodeURIComponent(j.code) + '">' + esc(TY.btn) + '</a>' : '';
  $('#qbody').innerHTML = '<div class="q-step fwd ty" data-when="' + when + '"><span class="ok">' + CHECK + '</span>'
    + '<h1 style="font-size:26px;font-weight:800">' + esc(nameIn(TY.title || 'תודה, {שם}', first)) + '</h1><p>' + esc(lines.filter(Boolean).join(' ')) + '</p>'
    + btn
    + '<div class="raz"><img src="img/raz.jpg" alt="רז מאיר כהן"><div><b>רז מאיר כהן</b><small>קבוצת תום הרוש</small></div></div></div>';
  var h = $('h1', $('#qbody')); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
}

step('view');
go(0, '');
})();
</script>
