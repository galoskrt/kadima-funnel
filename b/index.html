:root{
  --accent:#C2151C; --accent-mid:#A20C22; --accent-deep:#7F0224;
  --grad:linear-gradient(135deg,#C2151C,#A20C22,#7F0224);
  --ground:#FFFFFF; --paper:#F6F7F9; --step:#ECEEF1; --tint:#FBF1F1;
  --ink:#0F1216; --ink-soft:#4A4F57; --field:#D5D9DF;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Heebo','Segoe UI',sans-serif;color:var(--ink);background:var(--paper);touch-action:manipulation;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:16px 14px 40px;overflow-x:clip}
.card{background:var(--ground);border-radius:18px;width:min(560px,100%);margin:0 auto;position:relative;overflow:hidden;flex-shrink:0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 12px}
.brand img{height:44px;width:auto;object-fit:contain}
.brand .bline{font-size:14px;font-weight:700;color:var(--ink-soft)}
.prog-row{display:flex;align-items:center;gap:12px;padding:0 20px;margin-bottom:6px}
.prog{flex:1;height:6px;border-radius:99px;background:var(--step);overflow:hidden}
.prog>i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .45s cubic-bezier(.4,0,.2,1)}
.prog-n{font-size:14px;font-weight:700;color:var(--ink-soft);min-width:58px;text-align:left;font-variant-numeric:tabular-nums}
.body{padding:8px 20px 0}
.screen{display:none}
.screen.active{display:block;animation:rise .42s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ph{margin:0 -20px 20px;aspect-ratio:1200/640;background:var(--step) center/cover no-repeat}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:clamp(30px,7.4vw,46px);font-weight:900;line-height:1.12;letter-spacing:-.02em;margin-bottom:12px;text-wrap:balance}
h1 .hl{color:var(--accent)}
.sub{font-size:17px;line-height:1.6;margin-bottom:22px}
.qtitle{font-size:24px;font-weight:900;line-height:1.25;letter-spacing:-.01em;margin:14px 0 18px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:right;background:var(--paper);border:0;border-radius:14px;
  padding:16px;margin-bottom:12px;cursor:pointer;font-family:inherit;font-size:17px;font-weight:700;color:var(--ink);
  box-shadow:0 1px 2px rgba(15,18,22,.06),0 4px 12px rgba(15,18,22,.07);   /* עומק עדין לכל תשובה (גל 18/10) */
  transition:background .16s,transform .16s,box-shadow .16s;position:relative}
.opt:hover{background:var(--step);box-shadow:0 2px 4px rgba(15,18,22,.07),0 8px 20px rgba(15,18,22,.09);transform:translateY(-1px)}
.opt:active{transform:scale(.99)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .tick{width:24px;height:24px;border-radius:50%;border:2px solid #B9BEC6;flex:0 0 auto;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:background-color .16s,border-color .16s;background:#fff}
.opt.sel{background:var(--tint);box-shadow:inset -4px 0 0 var(--accent),0 1px 2px rgba(15,18,22,.06),0 4px 12px rgba(194,21,28,.10)}
.opt.sel .tick{background:var(--accent);border-color:var(--accent)}
.opt.sel .tick::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translateY(-1px)}
.opt .txt{flex:1;line-height:1.35}
.opt .mc{display:block;font-size:15px;font-weight:400;color:var(--ink-soft);margin-top:4px;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:var(--grad);color:#fff;border:none;border-radius:999px;
  padding:17px 22px;font-family:inherit;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 10px 26px rgba(194,21,28,.28);
  transition:transform .18s,box-shadow .18s;margin-top:6px} /* taste-skill-ignore: הצל והגרדיאנט של הכפתור הראשי הם חלק מספר המותג ומארכיטקטורת ה-CTA של גל */
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(194,21,28,.38)}
.btn:hover .arw{transform:translateX(-5px)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.arw{width:34px;height:11px;flex:0 0 auto;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.after{text-align:center;font-size:14px;color:var(--ink-soft);margin-top:10px}
.trust{text-align:center;font-size:14px;font-weight:700;color:var(--ink-soft);margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.dot{width:4px;height:4px;border-radius:50%;background:#B9BEC6}
.field{margin-bottom:14px;text-align:right}
.field label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px}
.field input{width:100%;background:#fff;border:1.5px solid var(--field);border-radius:14px;padding:14px 15px;font-family:inherit;font-size:17px;color:var(--ink);outline:none;transition:border-color .16s,box-shadow .16s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(194,21,28,.10)}
.field input.err{border-color:var(--accent)}
.field input[type=tel]{direction:ltr;text-align:right}
.hint{font-size:14px;color:var(--ink-soft);margin-top:6px;line-height:1.5}
.err-msg{color:var(--accent);font-size:14px;font-weight:700;margin-top:4px;min-height:0}
.err-msg:empty{display:none}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--ink);margin:4px 0 14px;cursor:pointer}
.consent input{width:20px;height:20px;flex:0 0 auto;margin-top:1px;accent-color:var(--accent)}
.consent a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.landload{width:96px;height:96px;margin:26px auto 18px;position:relative}
.landload .plot{position:absolute;inset:0;border-radius:12px;overflow:hidden;background:var(--tint)}
.landload .fill{position:absolute;left:0;right:0;bottom:0;height:12%;background:rgba(194,21,28,.35);animation:thgGrow 1.7s ease-in-out infinite}
.landload .pin{position:absolute;top:50%;left:50%;width:12px;height:12px;border-radius:50% 50% 50% 0;background:var(--accent);transform:translate(-50%,-70%) rotate(-45deg);animation:thgPin 1.7s ease-in-out infinite}
@keyframes thgGrow{0%,100%{height:12%}50%{height:78%}}
@keyframes thgPin{0%,100%{transform:translate(-50%,-70%) rotate(-45deg)}50%{transform:translate(-50%,-95%) rotate(-45deg)}}
.load-txt{text-align:center;font-size:20px;font-weight:900}
.load-sub{text-align:center;font-size:15px;color:var(--ink-soft);margin-top:6px}
.back{background:transparent;border:none;color:var(--ink-soft);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:8px 0;display:none}
.back:hover{color:var(--accent)}
.back.show{display:inline-flex;align-items:center;gap:6px}
.disc{text-align:center;font-size:13px;font-weight:700;color:var(--ink-soft);margin-top:20px;padding:12px 20px;background:var(--paper)}
.sub,.qtitle,.hint,.opt .txt,.consent span{text-wrap:pretty}
@media(prefers-reduced-motion:reduce){.screen.active{animation:none}.btn,.opt{transition:none}.landload .fill,.landload .pin{animation:none}}
@media(max-width:440px){.qtitle{font-size:22px}.opt{font-size:16px;padding:15px 14px}}

.badge{display:flex;width:fit-content;max-width:100%;align-items:center;gap:8px;background:var(--tint);color:var(--accent-deep);font-size:14px;font-weight:700;line-height:1.4;border-radius:6px;padding:7px 12px;margin:18px auto 0;text-align:center}
.badge .nw{white-space:nowrap}
@media(max-width:440px){.badge .sep{display:block;height:0;overflow:hidden}}
.bdot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto;animation:bdot 2.2s ease-in-out infinite}
@keyframes bdot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(194,21,28,.35)}50%{opacity:.55;box-shadow:0 0 0 6px rgba(194,21,28,0)}}
@media(prefers-reduced-motion:reduce){.bdot{animation:none}}
.btn{white-space:nowrap;border-radius:15px}
@media(max-width:440px){.btn{font-size:clamp(14px,4.1vw,17px);padding:17px 12px;gap:8px}.btn .arw{width:26px}}

const Q_BRANCH = [{"key": "b2", "title": "השקעה עם תשואה גבוהה יותר, אבל עם פחות ודאות: זה מתאים לך?", "options": [{"t": "גם וגם", "mc": "השקעה שתניב רווח בריא, עם מסמכים וגיבוי", "v": 2}, {"t": "כן. אצלי תשואה קודמת להכל", "mc": "הסיכון שאקח מחושב בהתאם לתשואה.", "v": 1}, {"t": "תלוי כמה גבוהה", "mc": "אני קודם רוצה לראות את המספרים", "v": 1}]}, {"key": "b2", "title": "מה הדבר הראשון שהיית רוצה לראות במו עיניך?", "options": [{"t": "מה קורה אם ארצה לצאת", "mc": "איך יוצאים, ומה כתוב על זה בחוזה.", "v": 1}, {"t": "את התוכנית הכוללנית ושלבי התכנון", "mc": "איפה המתחם עומד היום, ומה נשאר עד הבנייה.", "v": 2}, {"t": "איך בדיוק נקבע המחיר", "mc": "מי קבע אותו, ולפי מה.", "v": 2}]}, {"key": "b2", "title": "לכמה זמן הכסף הזה יכול לצאת לעבוד?", "options": [{"t": "גג 3 שנים", "mc": "מתאימה לי השקעה לטווח הקצר.", "v": 0}, {"t": "3 עד 7 שנים", "mc": "הקצב הטבעי של קרקע עם ודאות.", "v": 2}, {"t": "אין לי לחץ של זמן", "mc": "יש לי כסף שיושב בצד ולא עובד.", "v": 2}]}, {"key": "b2", "title": "איך נוח לך להתחיל?", "options": [{"t": "מהלך אחד משמעותי", "mc": "להרוויח בעיקר מהשלבים התכנוניים.", "v": 2}, {"t": "מההון שכבר יש לי", "mc": "הכסף שלי מחכה להחלטה.", "v": 2}, {"t": "עוד לא החלטתי", "mc": "את ההיקף בונים יחד בשיחה.", "v": 0}]}];
const Q_WHEN = {"key": "b3", "title": "מתי נכון לך להתחיל?", "options": [{"t": "יש לי מוכנות לקבל החלטה", "mc": "השאלה שלי היא \"איפה כן\" ולא \"מה מתאים לי\"", "v": 2, "canon": "מיד, אני מוכן להתקדם"}, {"t": "לא עכשיו", "mc": "צריך כאן מישהו שיבין אותי.. השארתי פרטים בהרבה מקומות.", "v": 0, "canon": "רק בודק אפשרויות בשלב זה"}, {"t": "בחודשים הקרובים", "mc": "לאסוף מידע מעכשיו, להחליט עם עצמי בקרוב.", "v": 1, "canon": "בחודשים הקרובים"}]};
const Q_MONEY = {"key": "b4", "title": "ההון האישי שלך זמין?", "options": [{"t": "כן, יושב ומחכה", "mc": "ובינתיים לא עובד בשבילי.", "v": 2}, {"t": "עוד לא", "mc": "שקלתי ללוות הון.", "v": 1}, {"t": "חלק זמין, חלק בדרך", "mc": "נבדוק יחד מה הכי נכון לך ומתי.", "v": 1}]};

/* ═══════════ מצב ═══════════ */
const pickIdx = { b1:null, b2:null, b3:null, b4:null };
let idx = 0;
const TOTAL = 4;
const utm = readUTM();
function topSearch(){ try{ return window.top.location.search || location.search; }catch(e){ return location.search; } }
function readUTM(){
  const p = new URLSearchParams(topSearch()); const g = k => p.get(k) || '';
  return { source:g('utm_source'), campaign:g('utm_campaign'), medium:g('utm_medium'), content:g('utm_content'), term:g('utm_term'),
    ad_id:g('ad_id'), adset_id:g('adset_id'), campaign_id:g('campaign_id'), fbclid:g('fbclid'), ref:document.referrer||'', variant:VARIANT };
}
function pxc(event, params){ try{ if(window.fbq) fbq('trackCustom', event, params||{}); }catch(e){} }
function qAt(i){ if(i===0) return Q_MOTIVE; if(i===1) return Q_BRANCH[pickIdx.b1 ?? 0]; if(i===2) return Q_WHEN; return Q_MONEY; }

/* ═══════════ פתיחה ═══════════ */
function glue(t){ if(!t) return t; t=String(t).replace(/(^|[\s])(ללא|בלי|לא|עם|של|על|את|כל|גם|רק|עד|לפי|כמו|אם|או|מול|בין|אל) (?=\S)/g,'$1$2\u00a0'); const i=t.lastIndexOf(' '); return i>0 ? t.slice(0,i)+'\u00a0'+t.slice(i+1) : t; }
document.getElementById('cEyebrow').textContent = COPY.eyebrow;
document.getElementById('cH1').innerHTML = COPY.B1;
document.getElementById('cSub').textContent = COPY.B2.split('\n').map(glue).join('\n');
document.getElementById('cBadgeT').innerHTML = COPY.BADGE.split(' · ').map(t=>'<span class="nw">'+t+'</span>').join('<span class="sep"> · </span>');
document.getElementById('cCta').textContent = COPY.B3;
document.getElementById('cTrust').innerHTML = COPY.trust.map(t=>'<span>'+t+'</span>').join('<span class="dot"></span>');
document.getElementById('cCapTitle').textContent = glue(COPY.C1);
document.getElementById('lName').textContent = COPY.L_NAME; document.getElementById('lPhone').textContent = COPY.L_PHONE; document.getElementById('lMail').textContent = COPY.L_MAIL;
document.getElementById('cPhoneHint').textContent = glue(COPY.C2);
document.getElementById('cCapCta').textContent = COPY.C3;
document.getElementById('cAfter').textContent = glue(COPY.C3_AFTER);
document.getElementById('cNameHint').textContent = glue(COPY.C_NAME);
document.getElementById('cMailHint').textContent = glue(COPY.C_MAIL);
document.getElementById('cConsent').innerHTML = COPY.CONSENT;
document.getElementById('cLoad').textContent = COPY.LOAD; document.getElementById('cLoadSub').textContent = COPY.LOAD_SUB;   /* __B19__ */

/* ═══════════ רינדור שאלה ═══════════ */
const mount = document.getElementById('qMount');
for(let i=0;i<TOTAL;i++){ const s=document.createElement('div'); s.className='screen'; s.dataset.screen='q'+i; mount.appendChild(s); }
function renderQ(i){
  const q = qAt(i), s = document.querySelector(`[data-screen="q${i}"]`);
  const sel = pickIdx[q.key];
  s.innerHTML = `<div class="qtitle">${glue(q.title)}</div>
    <div class="opts" role="group">${q.options.map((o,j)=>`<button type="button" class="opt${sel===j?' sel':''}${o.pref?' pref':''}" aria-pressed="${sel===j}" onclick="pick(${i},${j})"><span class="tick" aria-hidden="true"></span><span class="txt">${o.t}${o.mc?'<span class="mc">'+glue(o.mc)+'</span>':''}</span></button>`).join('')}</div>`;
}

/* ═══════════ ניווט ═══════════ */
function screens(){ return document.querySelectorAll('.screen'); }
function show(name){
  if(window.THG_STEP) window.THG_STEP(idx, name==='capture');
  screens().forEach(s => s.classList.toggle('active', s.dataset.screen===String(name)));
  document.getElementById('backBtn').classList.toggle('show', idx>0 && name!=='done');
  let pct = 0; if(name==='0') pct=4; else if(String(name).startsWith('q')) pct=((parseInt(String(name).slice(1))+1)/(TOTAL+1))*100; else if(name==='capture') pct=92; else if(name==='done') pct=100;
  document.getElementById('progBar').style.width = pct+'%';
  const qn = String(name).startsWith('q') ? parseInt(String(name).slice(1))+1 : 0;
  document.getElementById('progN').textContent = qn ? `${qn} מתוך ${TOTAL}` : (name==='capture' ? 'עוד רגע' : '');
  window.scrollTo(0,0);
}
function start(){ pxc('SurveyStart', {variant:VARIANT}); if(window.THG_FX) THG_FX('start'); idx=1; renderQ(0); show('q0'); }
function goBack(){ if(idx<=0) return; idx--; if(idx===0) show('0'); else { renderQ(idx-1); show('q'+(idx-1)); } }
function pick(qi, oi){
  const q = qAt(qi);
  pickIdx[q.key] = oi;
  if(qi===0 && pickIdx.__branch !== oi){ pickIdx.b2 = null; pickIdx.__branch = oi; }   // מניע אחר = ענף אחר
  document.querySelectorAll(`[data-screen="q${qi}"] .opt`).forEach((b,k)=>{ b.classList.toggle('sel', k===oi); b.setAttribute('aria-pressed', k===oi); });
  pxc('SurveyStep', {step:qi+1, variant:VARIANT});
  setTimeout(()=>{ if(qi < TOTAL-1){ idx = qi+2; renderQ(qi+1); show('q'+(qi+1)); } else { idx = TOTAL+1; show('capture'); } }, 260);
}

/* ═══════════ ניקוד ═══════════
   0 עד 6: הענף (0 עד 2) + מתי (0 עד 2) + זמינות הכסף (0 עד 2). 4 ומעלה חם. */
function score(){
  const b = Q_BRANCH[pickIdx.b1 ?? 0].options[pickIdx.b2 ?? -1], w = Q_WHEN.options[pickIdx.b3 ?? -1], m = Q_MONEY.options[pickIdx.b4 ?? -1];
  return (b?b.v:0) + (w?w.v:0) + (m?m.v:0);
}
function temperature(){ return score() >= HOT_MIN ? 'hot' : 'cold'; }
function labels(){
  const mo = Q_MOTIVE.options[pickIdx.b1], br = Q_BRANCH[pickIdx.b1].options[pickIdx.b2], wh = Q_WHEN.options[pickIdx.b3], mn = Q_MONEY.options[pickIdx.b4];
  return { mo, br, wh, mn };
}

/* ═══════════ שליחה ═══════════ */
function validPhone(p){ let d=(p||'').replace(/\D/g,''); if(d.startsWith('972')) d='0'+d.slice(3); return /^05\d{8}$/.test(d); }
function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e||''); }
function submitLead(){
  const name=document.getElementById('fName').value.trim(), phone=document.getElementById('fPhone').value.trim(), email=document.getElementById('fEmail').value.trim();
  let ok=true;
  const eN=document.getElementById('eName'), eP=document.getElementById('ePhone'), eE=document.getElementById('eEmail');
  const iN=document.getElementById('fName'), iP=document.getElementById('fPhone'), iE=document.getElementById('fEmail');
  eN.textContent=''; eP.textContent=''; eE.textContent=''; [iN,iP,iE].forEach(x=>x.classList.remove('err'));
  if(!name){ eN.textContent='נא למלא שם'; iN.classList.add('err'); ok=false; }
  if(!validPhone(phone)){ eP.textContent='מספר נייד לא תקין. צריך 10 ספרות שמתחילות ב־05'; iP.classList.add('err'); ok=false; }
  if(!validEmail(email)){ eE.textContent='נא למלא אימייל תקין'; iE.classList.add('err'); ok=false; }
  const eC=document.getElementById('eConsent'); eC.textContent='';
  if(!document.getElementById('fConsent').checked){ eC.textContent='צריך לסמן את האישור כדי להמשיך'; ok=false; }
  if(!ok){ const f=[iN,iP,iE].find(x=>x.classList.contains('err')) || document.getElementById('fConsent'); try{ f.focus(); }catch(_){} return; }
  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent=COPY.SUBMIT;
  const temp = temperature(), L = labels();
  const leadId = (window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(16).slice(2));
  window.__lid = leadId; window.__email = email; window.__name = name;
  const _ck = n => { const m = document.cookie.match('(^|;)\\s*'+n+'\\s*=\\s*([^;]+)'); return m ? m.pop() : ''; };
  const _fbclid = new URLSearchParams(location.search).get('fbclid');
  let _fbc = _ck('_fbc'); if (!_fbc && _fbclid) _fbc = 'fb.1.' + Date.now() + '.' + _fbclid;
  const answers = {
    q2: L.wh.canon, q4: L.mo.canon,                       // הקנוני של A, לרצפים, לדף המידע ולדוח
    b1: L.mo.t, b2: L.br.t, b3: L.wh.t, b4: L.mn.t,       // התשובות של B כפי שנבחרו
    bi: [pickIdx.b1, pickIdx.b2, pickIdx.b3, pickIdx.b4].join(','),   // האינדקסים, לקישור האישי לדף התוצאה (18/10)
  };
  const q_a = `[B · ${temp.toUpperCase()} · ${score()}/6] ` + [Q_MOTIVE.title+' → '+L.mo.t, Q_BRANCH[pickIdx.b1].title+' → '+L.br.t, Q_WHEN.title+' → '+L.wh.t, Q_MONEY.title+' → '+L.mn.t].join(' | ');
  const payload = { lead_id: leadId, name, phone, email, temperature: temp, score: score(), q_a, answers, variant: VARIANT, consent: { privacy: true, contact: true, at: new Date().toISOString() },
    utm, ref_url: location.href, ts: new Date().toISOString(), source: utm.source || 'שאלון B', fbp: _ck('_fbp') || undefined, fbc: _fbc || undefined };
  try{ if(window.fbq) fbq('track','Lead', {content_name:'survey_b', temperature:temp, value: temp==='hot'?2:1, currency:'ILS'}, {eventID: leadId}); }catch(e){}
  pxc('SurveyComplete', {temperature:temp, score:score(), variant:VARIANT});
  try{ const q=JSON.parse(localStorage.getItem('th_leads')||'[]'); q.push(payload); localStorage.setItem('th_leads',JSON.stringify(q)); }catch(e){}
  let done=false; const once=()=>{ if(done)return; done=true; routeTo(temp); };
  /* ליד שחוזר עם אותו טלפון (למשל מהרימרקטינג, ממכשיר אחר) לא נוצר מחדש: השרת מחזיר את המזהה הקיים שלו.
     משתמשים בו, אחרת המועד שיבחר בדף התוצאה נשלח למזהה שלא קיים ונאבד בשקט (19/10) */
  fetch(WORKER_URL, {method:'POST', keepalive:true, headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)})
    .then(r => r.json()).then(j => {
      if (j && j.lead_id && j.lead_id !== leadId) {
        window.__lid = j.lead_id;
        try{ const q=JSON.parse(localStorage.getItem('th_leads')||'[]'); const it=q.find(x=>x.lead_id===leadId); if(it){ it.lead_id=j.lead_id; localStorage.setItem('th_leads',JSON.stringify(q)); } }catch(e){}
      }
    }).catch(()=>{}).then(once);
  setTimeout(once, 2500);
  if(window.THG_FX) THG_FX('done');
  idx = TOTAL+2; show('done');
}
/* דף התוצאה בונה את האבחון החלקי מהבחירות: m מניע, b ענף, w מתי, k כסף */
function routeTo(temp){
  const q = new URLSearchParams({ t: temp, s: String(score()), m: String(pickIdx.b1), b: String(pickIdx.b2), w: String(pickIdx.b3), k: String(pickIdx.b4) });
  if(window.__lid) q.set('lid', window.__lid);
  if(window.__name) q.set('name', String(window.__name).trim().split(/\s+/)[0]);   /* שם פרטי בלבד, כמו בקישור מהוואטסאפ */
  const dest = RESULT_URL + '?' + q.toString();
  try{ localStorage.setItem('b_last', JSON.stringify({ url: dest, lid: window.__lid || '', at: Date.now() })); }catch(e){}
  try{ window.top.location.href = dest; }catch(e){ location.href = dest; }
}
show('0');
</script>
