<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#F6F7F9"/>
<title>בדיקת ההתאמה שלך · מתחם H · קבוצת תום הרוש</title>
<meta name="robots" content="noindex"/>
<link rel="preload" as="image" href="/b/media/hero-cpage-m.webp" media="(max-width:699px)"/>
<link rel="preload" as="image" href="/b/media/hero-cpage.webp" media="(min-width:700px)"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap');
:root{
  --bg:#F6F7F9; --gray:#ECEEF1; --card:#FFFFFF; --dark:#0f1216; --dark2:#181c22;
  --ink:#0f1216; --muted:rgba(15,18,22,.60); --faint:rgba(15,18,22,.42);
  --line:rgba(15,18,22,.10); --line-r:rgba(194,21,28,.20); --dline:rgba(255,255,255,.12);
  --accent:#C2151C; --accent2:#7F0224; --green:#157a3a; --gold:#B8892B;
  --grad:linear-gradient(135deg,#C2151C,#A20C22,#7F0224);
  --tint:rgba(194,21,28,.055); --tintg:rgba(21,122,58,.07);
  --sh:0 14px 44px rgba(16,16,16,.10); --sh-sm:0 6px 20px rgba(16,16,16,.07); --wa:#25d366;
  --rad:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:'Heebo','Assistant','Segoe UI',sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;overflow-x:clip}
.wrap{max-width:840px;margin:0 auto;padding:0 20px}
img{max-width:100%;display:block}
.arw{width:36px;height:11px;stroke:currentColor;stroke-width:1.5;fill:none;flex:0 0 auto;stroke-linecap:round;stroke-linejoin:round}
/* section backgrounds for rhythm */
.sec{padding:52px 0}
.sec-gray{background:var(--gray)}
.sec-dark{background:var(--dark);color:#fff}
.sec-tint{background:linear-gradient(180deg,transparent,var(--tint),transparent)}
.sec-tintg{background:linear-gradient(180deg,transparent,var(--tintg),transparent)}
/* header */
header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);transition:.3s}
header .wrap{display:flex;align-items:center;justify-content:space-between;padding:10px 20px}
header img{height:42px}
.h-cta{display:inline-flex;align-items:center;gap:9px;background:var(--grad);color:#fff;text-decoration:none;font-weight:800;font-size:13.5px;padding:9px 17px;border-radius:11px;box-shadow:0 6px 18px rgba(194,21,28,.28);transition:.16s}
.h-cta:hover{transform:translateY(-1px)}
.h-cta .arw{width:24px}
/* hero */
.hero{position:relative;text-align:center;overflow:hidden;isolation:isolate;color:#fff}
.hero-bg{position:absolute;inset:0;z-index:-1}
.hero-bg img{width:100%;height:100%;object-fit:cover;display:block}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,17,22,.34),rgba(14,17,22,.18) 45%,rgba(14,17,22,.52))}
.hero-inner{padding:72px 0 58px;background:radial-gradient(ellipse 92% 76% at 50% 44%,rgba(8,10,14,.48),transparent 72%)}
.hero h1{text-shadow:0 2px 30px rgba(0,0,0,.6),0 1px 4px rgba(0,0,0,.45)}
.hero .sub{text-shadow:0 1px 14px rgba(0,0,0,.5)}
.hero .eyebrow{text-shadow:none}
.hero .eyebrow{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
.hero h1{color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.4)}
.hero .hl{background:linear-gradient(135deg,#ff6167,#ff9a45);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .hl-g{color:#63e487}
.hero .sub{color:rgba(255,255,255,.92)}
.hero .note{color:rgba(255,255,255,.76)}
.trustband{background:#fff;border-bottom:1px solid var(--line);padding:22px 0}
/* hero with VSL (hot, no bg image) */
.hero-v{position:relative;text-align:center;padding:46px 0 34px;background:radial-gradient(ellipse 70% 60% at 76% -12%,rgba(194,21,28,.10),transparent 60%),radial-gradient(ellipse 60% 50% at 8% 112%,rgba(21,122,58,.07),transparent 55%),var(--bg)}
.hero-v h1{color:var(--ink);text-shadow:none;font-size:40px;line-height:1.14;margin-bottom:14px}
.hero-v .hl{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-v .sub-v{font-size:17.5px;color:var(--muted);max-width:600px;margin:0 auto 24px;font-weight:500}
.vsl{max-width:720px;margin:0 auto 24px;background:#0f1216;border-radius:20px;aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:var(--sh);position:relative;overflow:hidden;cursor:pointer;border:1px solid var(--line)}
.vsl-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 26%;z-index:0}
.vsl::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,18,22,.28),rgba(15,18,22,.66));z-index:1}
.vsl .play,.vsl .vt,.vsl small{z-index:2}
.vsl .play{position:relative;width:72px;height:72px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 10px 30px rgba(194,21,28,.5);transition:.2s}
.vsl:hover .play{transform:scale(1.08)}
.vsl .play::after{content:'';border-style:solid;border-width:12px 0 12px 19px;border-color:transparent transparent transparent #fff;margin-right:-4px}
.vsl .vt{position:relative;font-weight:800;font-size:18px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.vsl small{position:relative;opacity:.9;font-size:13px;margin-top:5px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
/* vertical-VSL modal (reels plays big only on click; page footprint stays the 16:9 card) */
.vmodal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(6,7,10,.93);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:16px}
.vmodal.on{display:flex}
.vmodal-video{height:min(84vh,860px);width:auto;max-width:94vw;aspect-ratio:9/16;background:#000;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.6);display:block}
.vmodal-x{position:absolute;top:16px;left:16px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);border:none;color:#fff;font-size:22px;cursor:pointer;z-index:2;transition:.16s}
.vmodal-x:hover{background:rgba(255,255,255,.28)}
.hero-v .note-v{font-size:13.5px;color:var(--faint);margin-top:12px}
@media(max-width:600px){.hero-v h1{font-size:29px}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-r);color:var(--accent);font-weight:800;font-size:12.5px;letter-spacing:.02em;padding:7px 16px;border-radius:30px;margin-bottom:18px;box-shadow:var(--sh-sm)}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
h1{font-size:39px;font-weight:900;line-height:1.15;letter-spacing:-.02em;margin-bottom:16px}
.hl{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hl-g{color:var(--green)}
.hero .sub{font-size:18px;color:rgba(255,255,255,.95);max-width:610px;margin:0 auto 26px;font-weight:500;text-shadow:0 1px 14px rgba(0,0,0,.55)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;background:var(--grad);color:#fff;text-decoration:none;border:none;cursor:pointer;font-family:inherit;font-size:18px;font-weight:800;padding:17px 36px;border-radius:15px;box-shadow:0 12px 32px rgba(194,21,28,.34);transition:.18s}
.btn:hover{transform:translateY(-2px);box-shadow:0 18px 42px rgba(194,21,28,.46)}
.btn .arw{width:40px}
.hero .note{font-size:13.5px;color:rgba(255,255,255,.85);margin-top:13px;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.fail .fi lottie-player,.jtl-lot lottie-player{width:100%;height:100%}
.tl-lot{width:58px;height:58px;margin:0 auto 8px;position:relative;z-index:2}
/* trust bar */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
.trust .t{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px 10px;box-shadow:var(--sh-sm)}
.trust .v{font-size:24px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.trust .l{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600;line-height:1.4}
/* section headers */
.kicker{text-align:center;color:var(--accent);font-weight:800;font-size:13px;letter-spacing:.06em;margin-bottom:8px}
.sec-dark .kicker{color:#ff6b6b}
.sec-t{font-size:31px;font-weight:900;text-align:center;line-height:1.2;letter-spacing:-.01em;margin-bottom:10px}
.sec-sub{text-align:center;color:var(--muted);max-width:610px;margin:0 auto 30px;font-size:16px}
.sec-dark .sec-sub{color:rgba(255,255,255,.62)}
/* thought bubble (problem) */
.think{max-width:660px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px 30px 26px;box-shadow:var(--sh);position:relative;font-size:19px;line-height:1.8;color:#2a2f36;font-weight:500}
.think::after{content:'';position:absolute;bottom:-16px;right:60px;width:30px;height:30px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.think .lead-in{display:block;color:var(--accent);font-weight:800;font-size:15px;margin-bottom:12px;letter-spacing:.01em}
.think .dots{display:flex;gap:6px;margin-top:16px}
.think .dots i{width:8px;height:8px;border-radius:50%;background:var(--line-r)}
.think-foot{text-align:center;margin-top:34px;font-size:17px;font-weight:700;color:var(--ink)}
.think-foot b{color:var(--accent)}
/* fails grid */
.fails{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fail{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--sh-sm);transition:.2s}
.fail:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.fail .fi{width:66px;height:66px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.fail .fi svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fail b{display:block;font-size:17px;margin-bottom:5px}
.fail p{color:var(--muted);font-size:14.5px;line-height:1.65}
/* JET scroll-fill timeline */
.jtl{position:relative;padding-right:60px;max-width:680px;margin:0 auto}
.jtl-line{position:absolute;right:29px;top:8px;bottom:8px;width:4px;background:var(--line-r);border-radius:4px}
.sec-dark .jtl-line{background:rgba(255,255,255,.14)}
.jtl-fill{position:absolute;right:29px;top:8px;width:4px;background:var(--grad);border-radius:4px;height:0}
.jtl-item{position:relative;margin-bottom:22px}
.jtl-item:last-child{margin-bottom:0}
.jtl-node{position:absolute;right:-46px;top:0;width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--line-r);display:flex;align-items:center;justify-content:center;transition:.35s;color:var(--faint);font-weight:900;font-size:18px}
.sec-dark .jtl-node{background:#fff;border-color:rgba(194,21,28,.4)}
.sec-dark .jtl-item.on .jtl-node{background:#fff;border-color:rgba(194,21,28,.95);color:var(--accent);box-shadow:0 0 24px rgba(194,21,28,.55),0 8px 20px rgba(0,0,0,.4)}
.jtl-node lottie-player{width:32px;height:32px}
.jtl-item.on .jtl-node{border-color:transparent;background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(194,21,28,.4);transform:scale(1.06)}
.jtl-node svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.jtl-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--sh-sm);transition:.4s cubic-bezier(.2,.7,.2,1);opacity:.5;transform:translateX(12px)}
.sec-dark .jtl-card{background:linear-gradient(180deg,#1c222c,#12161d);border:1px solid rgba(255,255,255,.13);box-shadow:0 12px 34px rgba(0,0,0,.5)}
.sec-dark .jtl-item.on .jtl-card{border-color:rgba(194,21,28,.55);box-shadow:0 16px 46px rgba(0,0,0,.6),0 0 26px rgba(194,21,28,.20)}
.jtl-item.on .jtl-card{opacity:1;transform:none;box-shadow:var(--sh);border-color:var(--line-r)}
.jtl-card h4{font-size:18px;font-weight:800;margin-bottom:5px}
.jtl-card p{color:var(--ink);font-size:14.7px}
.sec-dark .jtl-card p{color:rgba(255,255,255,.66)}
/* value proof timeline (horizontal) */
.tl{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px 24px 24px;box-shadow:var(--sh);position:relative;overflow:hidden;max-width:720px;margin:0 auto}
.tl-track{display:flex;justify-content:space-between;position:relative;margin:20px 0 0}
.tl-track::before{content:'';position:absolute;top:29px;right:6%;left:6%;height:4px;background:var(--line-r);border-radius:4px;opacity:.5}
.tl-track::after{content:'';position:absolute;top:29px;right:6%;height:4px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--green));border-radius:4px;width:0;transition:width 1.6s ease}
.tl.on .tl-track::after{width:88%}
.tl-pt{position:relative;z-index:2;text-align:center;flex:1}
.tl-pt .dot{width:42px;height:42px;border-radius:50%;background:#fff;border:4px solid var(--accent);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--accent);box-shadow:0 4px 12px rgba(194,21,28,.2)}
.tl-pt.g .dot{border-color:var(--green);color:var(--green)}
.tl-pt .y{font-size:12.5px;color:var(--faint);font-weight:700}
.tl-pt .p{font-size:18px;font-weight:900;margin-top:3px}
.tl-note{text-align:center;margin-top:20px;font-size:15px;color:var(--muted)}
.tl-note b{color:var(--green)}
/* value 3-cards (was timeline) */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:760px;margin:0 auto}
.vcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 16px;text-align:center;box-shadow:var(--sh-sm);transition:.2s}
.vcard:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:var(--line-r)}
.vcard lottie-player{width:76px;height:76px;margin:0 auto 10px}
.vcard .y{font-size:12.5px;color:var(--faint);font-weight:700}
.vcard .p{font-size:23px;font-weight:900;margin-top:4px;color:var(--ink)}
.vcard .p span{font-size:12px;font-weight:600;color:var(--muted)}
.vcard.g .p{color:var(--green)}
@media(max-width:600px){
  .vgrid{grid-template-columns:1fr;gap:11px}
  .vcard{display:flex;align-items:center;gap:16px;text-align:right;padding:16px 18px}
  .vcard lottie-player{margin:0;flex:0 0 auto;width:62px;height:62px}
  .vcard .p{font-size:20px}
}
/* testimonials */
.revs{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 16px;-webkit-overflow-scrolling:touch}
.revs::-webkit-scrollbar{height:6px}.revs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:6px}
.revs img{scroll-snap-align:center;flex:0 0 78%;max-width:340px;height:auto;background:#fff;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.4);cursor:zoom-in;object-fit:contain}
@media(min-width:720px){.revs img{flex-basis:32%}}
/* stories */
.stories{display:flex;flex-direction:column;align-items:center;position:relative}
.story{position:sticky;width:100%;max-width:640px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 -4px 24px rgba(16,16,16,.08),0 16px 44px rgba(16,16,16,.12);margin-bottom:44px}
.stories .story:nth-child(1){top:92px}
.stories .story:nth-child(2){top:110px}
.stories .story:nth-child(3){top:128px}
.stories .story:last-child{margin-bottom:0}
@media(max-width:600px){.story{padding:22px;margin-bottom:34px}.stories .story:nth-child(1){top:78px}.stories .story:nth-child(2){top:92px}.stories .story:nth-child(3){top:106px}}
.story .top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.story .av{width:52px;height:52px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;flex:0 0 auto}
.story .nm{font-weight:800;font-size:17px}.story .ro{font-size:13px;color:var(--faint)}
.story .big{background:var(--tintg);border:1px solid rgba(21,122,58,.18);color:var(--green);font-weight:900;font-size:15px;border-radius:12px;padding:9px 14px;display:inline-block;margin:4px 0 12px}
.story p{font-size:15.5px;color:var(--ink);line-height:1.75}.story p b{color:var(--accent)}
/* tom */
.tom{display:grid;grid-template-columns:1fr 240px;gap:28px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--sh)}
.tom img{width:100%;border-radius:16px;object-fit:contain;background:transparent}
.tom h3{font-size:23px;font-weight:900;margin-bottom:10px}
.tom h3 span{color:var(--accent)}
.tom p{color:var(--muted);font-size:15.5px;margin-bottom:9px}.tom p b{color:var(--ink)}
.tom .sig{color:var(--green);font-weight:800;font-size:15.5px;margin-top:4px}
@media(max-width:620px){.tom{grid-template-columns:1fr;text-align:center}.tom img{max-width:230px;margin:0 auto}}
/* faq */
.faq details{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:11px;box-shadow:var(--sh-sm);overflow:hidden;transition:.2s}
.faq details[open]{border-color:var(--line-r);box-shadow:var(--sh)}
.faq summary{list-style:none;cursor:pointer;padding:18px 20px;font-weight:800;font-size:16.5px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .pl{width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;transition:.25s}
.faq details[open] summary .pl{transform:rotate(45deg)}
.faq .a{padding:0 20px 18px;color:var(--muted);font-size:15px;line-height:1.7}
/* convert (survey-language, inviting) */
.join-card{max-width:520px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 30px;box-shadow:var(--sh);text-align:center}
.join-card .kicker{margin-bottom:6px}
.join-card h2{font-size:26px;font-weight:900;margin-bottom:10px}
.join-card p{color:var(--muted);font-size:16px;margin-bottom:22px}
.jfield{text-align:right;margin-bottom:8px}
.jfield label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
.jfield input{width:100%;background:#fff;border:1.6px solid var(--line);border-radius:13px;padding:15px;font-family:inherit;font-size:16px;color:var(--ink);outline:none;transition:.16s}
.jfield input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(194,21,28,.10)}
.jfield input.err{border-color:var(--accent)}
.jerr{color:var(--accent);font-size:12.5px;font-weight:700;min-height:16px;text-align:right;margin:4px 0 10px}
.join-card .btn{width:100%}
.join-card .note{font-size:13px;color:var(--faint);margin-top:14px}
/* calendar embed (hot) */
.cal-wrap{background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:var(--sh);overflow:hidden;max-width:760px;margin:0 auto}
.cal-wrap iframe{width:100%;height:660px;border:0;border-radius:12px;display:block}
@media(max-width:560px){.cal-wrap iframe{height:600px}}
/* footer */
footer{background:var(--dark);color:rgba(255,255,255,.66);padding:34px 0 26px;text-align:center}
footer .flogo{height:48px;margin:0 auto 18px;background:#fff;padding:10px 16px;border-radius:13px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.foot-title{font-size:15px;font-weight:700;color:rgba(255,255,255,.85);max-width:440px;margin:0 auto 12px;line-height:1.55}
.social{display:flex;justify-content:center;gap:10px;margin:2px 0 18px}
.social a{width:48px;height:48px;display:flex;align-items:center;justify-content:center;transition:.2s}
.social a:hover{transform:translateY(-3px) scale(1.07)}
.social lottie-player{width:100%;height:100%}
.social svg{width:20px;height:20px;fill:#fff}
.disc{font-size:12.5px;line-height:1.65;max-width:640px;margin:0 auto}
.disc b{color:#ff6b6b}
.foot-links{margin-top:12px;font-size:12.5px}

.copy{font-size:11.5px;color:rgba(255,255,255,.4);margin-top:12px}
/* lightbox + float */

.lb.on{display:flex}.lb img{max-width:96vw;max-height:92vh;border-radius:10px}
.lb .x{position:absolute;top:18px;left:18px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:24px;cursor:pointer}
.float{position:fixed;left:0;right:0;bottom:0;z-index:55;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px;transform:translateY(120%);transition:.35s;box-shadow:0 -6px 24px rgba(16,16,16,.1)}

.rv.in{opacity:1;transform:none}

/* google reviews gallery */

.rgal .rev{width:100%;height:auto;display:block;object-fit:contain;background:#fff;border-radius:12px;border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.05),0 0 22px rgba(255,255,255,.13);cursor:zoom-in;transition:transform .2s ease,box-shadow .2s ease}

.rgal .rev.hid{display:none}
.rgal-more{text-align:center;margin-top:26px}
.rgal-btn{background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.26);color:#fff;font-family:inherit;font-weight:800;font-size:16px;padding:14px 32px;border-radius:100px;cursor:pointer;transition:.16s}

.story .av img{width:100%!important;height:100%!important;object-fit:cover;border-radius:50%;display:block;max-width:none!important}
.story .av{overflow:hidden}

/* הוכחות מתחם H (גל 12/10): מסמכים אמיתיים, ברזולוציה מלאה, לחיצה פותחת את המקור */
.proof{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:880px;margin:26px auto 0}
.proof-card{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--ink);box-shadow:var(--sh)}
.proof-card img{width:100%;height:auto;aspect-ratio:16/10;object-fit:contain;object-position:center;border-radius:10px;border:1px solid var(--line);background:#f6f7f9;display:block}
.proof-card span{font-size:14.5px;line-height:1.5;text-wrap:pretty}
.proof-card b{color:var(--accent)}
.proof-hint{text-align:center;font-size:13px;color:var(--muted);margin-top:12px}
.sec-dark .proof-card{background:#fff}
.proof-link{display:inline-block;margin-top:10px;font-size:14px;font-weight:700;color:var(--accent);text-decoration:none}
.sec-dark .proof-link{color:#ff8a8f}
.proof-thumb{display:block;margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.proof-thumb img{width:100%;height:auto;display:block}
@media(max-width:700px){.proof{grid-template-columns:1fr}}

/* ═══ גרסה B, דף התוצאה (19/10): רק תוספות על השפה של HPAGE. טוקנים: 8pt, רדיוסים 12/18/20, האדום של המותג לכוונת תשומת לב ═══ */
:root{--s1:8px;--s2:16px;--s3:24px;--s4:32px;--s5:48px;--s6:64px;--s7:96px}
.wrap-l{max-width:1120px;margin:0 auto;padding:0 20px}
.sec{padding:var(--s6) 0}
@media(max-width:600px){.sec{padding:var(--s5) 0}}
.sec-t .hl,.pain-h .hl,.rc-sum .hl,h1 .hl{white-space:normal}
.sec-dark .hl{background:linear-gradient(135deg,#ff6167,#ff8f6b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.left{text-align:right}.left.kicker,.left .kicker{text-align:right}
/* ── 1. התוצאה (גל 19/10, ח־67): על התמונה של CPAGE עם אוברליי כהה. בר התקדמות, כותרת, המשפט מתחת, ואז הכרטיס.
   בטלפון התמונה רק מאחורי הטקסט וראש הכרטיס; במחשב הטקסט מימין והכרטיס משמאל, שניהם על התמונה ── */
.rh{position:relative;isolation:isolate;overflow:hidden;color:#fff}
.rh-bg{position:absolute;inset:0;z-index:-2}
.rh-bg img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}
.rh-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,17,22,.62),rgba(14,17,22,.42) 42%,rgba(14,17,22,.66))}
.rh-grid{display:grid;gap:var(--s3);padding-block:var(--s3) var(--s4)}
.rh-text{text-align:center}
.rh h1{color:#fff;font-size:39px;line-height:1.18;margin:0;text-shadow:0 2px 24px rgba(0,0,0,.45)}
.rh h1 .hl{background:linear-gradient(135deg,#ff6167,#ff9a45);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.rh-sub{font-size:16.5px;color:rgba(255,255,255,.94);font-weight:500;line-height:1.6;margin-top:var(--s2);white-space:pre-line;text-shadow:0 1px 14px rgba(0,0,0,.55)}
.rcard-wrap{position:relative}
.rcard-wrap::before{content:'';position:absolute;top:72px;bottom:-400px;left:-100vw;right:-100vw;background:var(--bg);z-index:-1}
/* בר ההתקדמות: מתמלא מימין לשמאל עד 88%, כמו "כמעט סיימנו" */
.pbar{position:relative;display:block;max-width:440px;height:48px;margin:0 auto var(--s3);border-radius:999px;background:#E3E5E9;overflow:hidden;text-decoration:none;box-shadow:0 10px 28px rgba(0,0,0,.32)}
.pfill{position:absolute;top:0;bottom:0;inset-inline-start:0;width:90%;border-radius:999px;background:var(--grad);overflow:hidden;animation:pgrow 1.9s cubic-bezier(.2,.7,.2,1) .3s both}
.pfill::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(120%);animation:pshine 3.4s ease-in-out 2.4s infinite}
.ptx{position:relative;display:flex;align-items:center;justify-content:center;height:100%;padding:0 14px;font-weight:900;font-size:16.5px;color:#2B2F36;white-space:nowrap}
.ptx2{position:absolute;top:0;bottom:0;inset-inline-start:0;width:var(--bw,100%);color:#fff}
.pbar.done .pfill{width:100%;animation:none}
@keyframes pgrow{from{width:8%}to{width:90%}}
@keyframes pshine{0%{transform:translateX(120%)}55%,100%{transform:translateX(-120%)}}
@media(prefers-reduced-motion:reduce){.pfill,.pfill::after{animation:none}}
.rcard{position:relative;color:var(--ink);background:#fff;border:2px solid var(--accent);border-radius:20px;padding:20px 20px 18px;box-shadow:0 14px 44px rgba(194,21,28,.12);text-align:right}
.rc-intro{font-size:14.5px;color:var(--muted);font-weight:600;line-height:1.55}
.rc-sum{font-size:21px;font-weight:900;line-height:1.38;margin-top:6px}
.rc-rows{list-style:none;margin-top:var(--s2)}
.rc-rows li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.rc-ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:13px;margin-top:2px}
.rc-ic.ok{background:var(--green)}.rc-ic.ask{background:#8A8F98}.rc-ic.honest{background:var(--gold)}
.rc-ic svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rc-nd{display:block;font-weight:800;font-size:15.5px;line-height:1.45}
.rc-an{display:block;font-size:15px;color:var(--muted);margin-top:2px;line-height:1.6}
.rc-rows li.open{background:var(--tint);border:0;border-radius:12px;padding:12px;margin-top:6px}
.rc-rows li.open .rc-an{color:var(--ink)}
.rcard .btn{width:100%;margin-top:var(--s2);font-size:17px;padding:15px 16px;white-space:nowrap}
/* {{...}} בכותרת הכרטיס: קופסה בגרדיאנט המותג עם טקסט לבן (גל: "חייב להיות בולט") */
.rc-next{font-size:17.5px;font-weight:500;color:var(--ink);line-height:1.5;margin-top:8px}
.hlx{font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.rc-calm{text-align:center;font-size:13.5px;color:var(--faint);margin-top:10px;line-height:1.55}
.rc-num{text-align:center;font-size:13.5px;color:var(--muted);margin-top:4px}
.rc-num b{direction:ltr;unicode-bidi:isolate;color:var(--ink)}
.rc-num a{color:var(--accent);font-weight:700;margin-inline-start:6px}
.rc-booked{margin-top:var(--s2);background:var(--tintg);color:var(--green);font-weight:800;border-radius:12px;padding:12px 14px;line-height:1.55}
@media(min-width:960px){
  .rh-bg::after{background:linear-gradient(270deg,rgba(14,17,22,.74),rgba(14,17,22,.5) 55%,rgba(14,17,22,.38))}
  .rh-grid{grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--s3);align-items:start;padding-block:var(--s5) var(--s6)}
  .rh-text{grid-column:1/span 6;text-align:right;padding-top:var(--s4)}
  .pbar{margin-inline:0}
  .rh-sub{max-width:520px}
  .rcard-wrap{grid-column:7/span 6}
  .rcard-wrap::before{display:none}
  .rcard{padding:26px 28px 22px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
}
@media(max-width:600px){.rh h1{font-size:27px}.rh-sub{font-size:15.5px}.pbar{height:46px}.ptx{font-size:clamp(14px,4.1vw,16px);padding:0 10px}.rcard .btn{font-size:clamp(15px,4.3vw,17px);padding:15px 12px;gap:10px}.rcard .btn .arw{width:30px}}
/* ── 2. יש לך כסף בצד (לפי העיצוב לדוגמה של גל) ── */
.pain{background:#fff radial-gradient(rgba(15,18,22,.055) 1px,transparent 1.3px) 0 0/22px 22px;padding:var(--s6) 0}
.pain-top{display:grid;gap:var(--s3);align-items:center}
.pain-h{font-size:39px;font-weight:900;line-height:1.15;letter-spacing:-.02em;border-inline-start:5px solid var(--accent);padding-inline-start:18px;margin-top:6px}
.pain-sub{font-size:17px;color:var(--muted);margin-top:var(--s2);max-width:580px;font-weight:500;line-height:1.7}
.pain-ph{display:none}
.pain-lead{font-weight:800;font-size:17px;margin:var(--s5) 0 var(--s2)}
.thoughts{display:grid;gap:var(--s2)}
.tc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 22px;box-shadow:var(--sh-sm)}
.tico{width:56px;height:56px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tico svg{width:26px;height:26px;stroke:var(--accent);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tc h3{font-size:18px;font-weight:900;line-height:1.45;margin-top:var(--s2)}
.tc .rule{display:block;width:36px;height:3px;background:var(--accent);border-radius:2px;margin:14px 0 12px}
.tc p{color:var(--muted);font-size:15px;line-height:1.65}
.punch{margin-top:var(--s4);background:var(--tint);border:1px solid var(--line-r);border-radius:20px;padding:24px;display:flex;gap:20px;align-items:center}
.punch .p1,.punch .p2{font-size:28px;font-weight:900;line-height:1.22;letter-spacing:-.01em}
.punch-after{text-align:center;margin:var(--s3) auto 0;max-width:640px}
.punch-after .pk{font-weight:900;font-size:17px}
.punch-after .pp{color:var(--muted);font-size:15.5px;margin-top:6px}
.punch-after .pc{font-weight:800;font-size:16.5px;margin-top:10px}
@media(min-width:960px){
  .pain-top{grid-template-columns:repeat(12,minmax(0,1fr))}
  .pain-head{grid-column:1/span 7}
  .pain-ph{display:block;grid-column:10/span 3;position:relative;max-width:280px;justify-self:end}
  .pain-ph img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;border-radius:20px;position:relative;z-index:1}
  .pain-ph::before{content:'';position:absolute;inset:18px -14px -14px 18px;border:1.5px solid var(--line-r);border-radius:22px}
  .thoughts{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
}
@media(max-width:600px){.pain{padding:var(--s5) 0}.pain-h{font-size:29px}.punch{padding:20px;gap:14px;align-items:flex-start}.punch .p1,.punch .p2{font-size:21px}.punch .tico{width:46px;height:46px}.punch .tico svg{width:22px;height:22px}}
/* ── 3. ציר הזמן: כותרת בצד, הציר לידה (אסימטרי) ── */
.split{display:grid;gap:var(--s3)}
.split .kicker,.split .sec-t,.split .sec-sub{text-align:right;margin-inline:0}
/* "אנחנו כאן" (גל 19/10, ח־67): ירוק, שאי אפשר לפספס גם בגלילה מהירה. נקודה ירוקה על הציר, מסגרת ירוקה עבה ורקע ירוק בהיר, תגית אדומה עם דגל לבן */
.jtl-item.here .jtl-node{background:linear-gradient(135deg,#22a85c,#157A3A);border-color:transparent;color:#fff;box-shadow:0 0 0 8px rgba(21,122,58,.2),0 8px 22px rgba(21,122,58,.38);transform:scale(1.08)}
.jtl-item.here .jtl-card{background:#EAF7EF;border:3px solid #157A3A;opacity:1;transform:none;box-shadow:0 14px 34px rgba(21,122,58,.2)}
.jtl-item.here .jtl-card h4{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.jtl-item.here .jtl-card p{color:var(--ink)}
.jtl-item.done .jtl-node svg{stroke:currentColor}
.herepulse{width:12px;height:12px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
.here-tag{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:900;color:#fff;background:var(--grad);border-radius:999px;padding:5px 13px;box-shadow:0 6px 16px rgba(194,21,28,.32)}
.here-tag svg{width:15px;height:15px;fill:#fff;stroke:#fff;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.jtl-item.next .jtl-card h4{color:var(--muted)}
@media(min-width:960px){.split{grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--s3)}.split-head{grid-column:1/span 5;position:sticky;top:110px;align-self:start}.split-body{grid-column:7/span 6}.split .jtl{margin:0}}
/* ── 4. למה דווקא עכשיו ── */
.now{text-align:center}
.now .dateb{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,107,107,.5);color:#ff8a8f;font-weight:800;font-size:13px;border-radius:999px;padding:6px 14px;margin-bottom:var(--s2)}
.now .sec-t{font-size:39px}
.now .sec-sub{max-width:560px;font-size:17px}
.now lottie-player{width:84px;height:84px;margin:0 auto var(--s1)}
@media(max-width:600px){.now .sec-t{font-size:29px}}
/* ── 5. החלופות (הכרטיסים של CPAGE) ── */
.fails{max-width:840px;margin:0 auto}
.alt-close{text-align:center;max-width:620px;margin:var(--s4) auto 0;font-size:17px;font-weight:800;line-height:1.55}
/* ── 6. שלוש חותמות ── */
.dgrid{display:grid;gap:var(--s2);max-width:960px;margin:0 auto}
.dcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--sh-sm);display:grid;grid-template-columns:64px 1fr;gap:4px 14px;align-items:center}
.dcard lottie-player{grid-row:1/span 2}
.dcard b{font-size:16.5px;line-height:1.45}
.dcard span{font-size:13.5px;color:var(--faint);font-weight:600}
.doc-close{text-align:center;margin-top:var(--s3);font-weight:800;font-size:16.5px}
@media(min-width:960px){.dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.dcard{grid-template-columns:1fr;text-align:center;justify-items:center;padding:26px 20px}.dcard lottie-player{grid-row:auto}}
/* ── 7. היישוב לפניך ── */
.facts4{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.facts4 .t{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 14px;box-shadow:var(--sh-sm);text-align:center}
.facts4 .v{font-size:23px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.15}
.facts4 .l{font-size:13px;color:var(--muted);margin-top:6px;font-weight:600;line-height:1.45}
.mapcard{max-width:560px;margin:var(--s4) auto 0}
.mapcard img{max-height:320px;aspect-ratio:auto}
.town-note{text-align:center;font-size:12.5px;color:var(--faint);margin-top:10px}
/* ── 8. היציאה ── */
.exitcard{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--sh);display:grid;grid-template-columns:72px 1fr;gap:var(--s2);align-items:start}
.exitcard .kicker,.exitcard .sec-t{text-align:right}
.exitcard .sec-t{font-size:26px;margin-bottom:8px}
.exitcard p{color:var(--muted);font-size:16px;line-height:1.7}
@media(max-width:600px){.exitcard{grid-template-columns:1fr;text-align:right}.exitcard .sec-t{font-size:22px}}
/* ── 9. הביקורות ── */
.revq{font-size:29px}
.rev-src{text-align:center;color:rgba(255,255,255,.62);font-size:14px;margin-top:-4px}
.gline{display:flex;align-items:center;justify-content:center;gap:10px;margin:var(--s2) 0 var(--s3)}
.gline .gw{font:700 22px/1 Arial,Helvetica,sans-serif;letter-spacing:-.5px;direction:ltr}
.gline .st{display:flex;gap:2px;direction:ltr}
.gline b{font-size:18px}
@media(max-width:600px){.revq{font-size:22px}}
/* ── 10. תום ── */
.tom .kicker{text-align:right}
.tom .vis{color:var(--ink);font-weight:800;font-size:16px}
.tom .grp{font-size:14px;color:var(--faint)}
.vals{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.vals span{background:var(--tint);color:var(--accent2);font-weight:800;font-size:13px;border-radius:999px;padding:5px 13px}
@media(max-width:620px){.tom .kicker{text-align:center}.vals{justify-content:center}}
/* ── 11. בחירת מועד (הכרטיס של HPAGE) ── */
.join-card{max-width:560px}
.join-card h2 .hl{white-space:normal}
.mynum{background:var(--bg);border-radius:12px;padding:10px 14px;font-size:14.5px;margin:-8px 0 14px}
.mynum b{direction:ltr;unicode-bidi:isolate}
.wins{display:grid;gap:10px;border:0;margin-bottom:14px}
.win input{position:absolute;opacity:0;pointer-events:none}
.win label{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border:1.6px solid var(--line);border-radius:13px;padding:14px 16px;cursor:pointer;transition:.16s}
.win label:hover{border-color:var(--line-r)}

 קבעה: 3,700 ש״ח למטר, כלומר 370,000 ש״ח ליחידת קרקע של כ־100 מ״ר.\nהמחיר מתעדכן לפי התקדמות הסטטוס התכנוני.", "R2.2.0": "לפי הערכת השמאי, התוכנית המפורטת צפויה להיות מאושרת בתוך כ־5 שנים.", "R2.2.1": "לפי הערכת השמאי, התוכנית המפורטת צפויה להיות מאושרת בתוך כ־5 שנים, בתוך הטווח שסימנת.", "R2.2.2": "קרקע בשלבי תכנון צריכה בדיוק את זה: סבלנות. ובינתיים, הכסף שלך שיושב בצד מקבל משמעות.", "R2.3.0": "זה אפשרי, בהיקף שמותאם אליך, במודל שנבנה יחד. משקיעים בדיוק בתקופת ההשבחה: אחרי שהתוכנית הכוללנית אושרה, ולפני התוכנית המפורטת.", "R2.3.1": "השקעה מותאמת אישית, בדיוק בתנאים שלך ובהיקף של ההון שמחכה להחלטה.", "R2.3.2": "בשיחה נבדוק אם ניתן להתאים לך מודל אישי, בדיוק בתנאים שלך ובהיקף של ההון שמחכה להחלטה.", "R3.0": "אם ככה, השיחה שלנו תהיה יותר ממוקדת בך ובצורך האישי שלך.\nבינתיים, יש בדף הזה הרבה מידע שחשוב לי להעביר לך. גלילה נעימה.", "R3.1": "אני מבין אותך, רוב המשקיעים שלי נמצאים בדיוק בנקודה הזו. אשמח להבין לעומק את הצורך שלך ולעזור לך לקבל את ההחלטה המושכלת ביותר עבורך.", "R3.2": "אם ככה, השיחה שלנו תהיה יותר ממוקדת בך ובצורך האישי שלך.\nבינתיים, יש בדף הזה הרבה מידע שחשוב לי להעביר לך. גלילה נעימה.", "R4.0": "זה מה שמאפשר להיכנס עכשיו, ולהשביח את ההון כבר מהשלב הנוכחי של התכנון.", "R4.1": "בכנות, אנו לא מאפשרים מימון. אפשר להיכנס גם עם הון מלווה, וזה בסדר גמור מבחינתנו. אבל לפני שרצים לקחת הלוואה, נשוחח ונבין יחד היקף ולוח זמנים שיתאימו גם ליעדים שלך.", "R4.2": "התזמון משחק כאן תפקיד מפתח. לפני שממהרים, מומלץ קודם לתאם ציפיות באופן אישי, בשיחה איתי.", "R5": "מה שעוד פתוח: איזה היקף מתאים לך, ובאיזה לוח זמנים. את זה מאבחנים ישירות בשיחה של 15 דקות איתי.", "C.call": "15 דקות בטלפון, בזמן שנוח לך ובלי לנסוע לשום מקום. שואלים, ומקבלים תשובות.", "C.cta": "לתיאום השיחה עם תום", "C.num": "תום מתקשר מ־053-302-5464 · שמירה באנשי הקשר", "C.booked": "השיחה שלך שמורה {w}. אם צריך לשנות, אפשר לכתוב לנו בוואטסאפ.", "PAIN.k": "רגע לפני שמדברים על השקעה", "PAIN.h1": "אולי יש לך כסף בצד.", "PAIN.h2": "אבל אין לך שקט.", "PAIN.sub": "עבדת קשה בשביל הכסף שלך. חסכת, ויתרת, ועכשיו ברור לך שהוא יכול לעשות יותר, אבל אין לך שום כוונה לסכן אותו בשביל עוד הבטחה יפה.", "PAIN.lead": "ואולי גם המחשבות האלה עברו לך בראש:", "PAIN.t1": "״כל פעם שמציעים לי ׳להשקיע את הכסף שלי׳, הדבר הראשון שעולה לי בראש: איפה הקאץ׳?!״\nכולם מבטיחים תשואות ורווחים. אבל למי באמת אפשר להאמין?", "PAIN.t2": "״חסכתי כסף, אבל הוא פשוט לא עושה כלום.״\nברור לי שהכסף שלי יכול לעבוד יותר טוב. רק לא ברור לי איפה לשים אותו.", "PAIN.t3": "״אני רואה אחרים מתקדמים, ואני עדיין על הגדר.״\nמצד אחד, אני לא רוצה לפספס שוב. מצד שני, אני לא אהמר על הכסף שלקח לי שנים לבנות.", "PUNCH.1": "לא מפחיד אותך שהכסף שלך יעבוד.", "PUNCH.2": "מפחיד אותך שהוא יעבוד נגדך.", "PUNCH.k": "וזה בדיוק ההבדל.", "PUNCH.p": "לא חסר לך עוד מישהו שיגיד לך שההשקעה שלו מדהימה. חסר לך מישהו שיראה לך את המספרים, את המסמכים, את הסיכונים ואת האפשרויות שלך, וייתן לך להחליט בעצמך.", "PUNCH.c": "כי לפני שהכסף שלך מתחיל לעבוד, מגיע לך להבין בדיוק מה צפוי לו.", "ALT.h": "שמוצעת בשוק, פותרת רק [[חצי מהציפיות הפיננסיות]] שלך", "ALT.1": "העו״ש והפיקדון הבנקאי: הכסף נח בשקט, אבל לא עובד בשבילך. ובכל שנה שהכסף שלך יושב שם, הוא שווה לך קצת פחות בכיס.", "ALT.2": "דירה להשקעה: 2-3% תשואה בשנה על הנכס, בנוסף לשכר הדירה. ועדיין, זה בקושי מכסה את המשכנתא שלקחת ל־20 שנה. כדי שהכסף יעבוד בשבילך, צריך לעבוד בשביל הבנק.", "ALT.3": "שוק ההון: אולי יש תשואה, אבל זה הימור. ובקזינו כמו בקזינו, אף אחד לא נותן לך גב. המחיר זז כל יום, והשליטה לא אצלך.", "ALT.4": "עוד הזדמנות מפרסומת: הרבה הבטחות, הרבה פגישות, ומעט מאוד הוכחות במסמכים.", "ALT.f": "מה שחסר בכולן הוא השילוב: כסף שעובד, בהיקף שנכון לך, ועם מסמך מאחורי כל טענה. וזה בדיוק מה שאנחנו מציעים לך לבדוק כאן.", "NOW.h": "אז למה דווקא עכשיו?", "NOW.big": "השנים המתישות [[כבר מאחורינו.]]", "NOW.p": "ב־18/12/2024 ההמתנה לתוכנית במתחם H נגמרה, והתוכנית הכוללנית אושרה. מי שנכנס עכשיו, נכנס אחרי ההחלטה הגדולה ולפני התוכנית המפורטת.", "E2H": "לדעת איך נכנסים, [[ואיך יוצאים.]]", "E2L": "כל מה שלא מספיק שקוף בעסקאות קרקע, כאן מול העיניים שלך.", "E2.1": "תוכנית מתאר כוללנית מספר 457-0112086 כבר אושרה ב־18/12/2024, ופורסמה לתוקף.", "E2.2": "שמאי מקרקעין מוסמך קבע שווי של 3,700 ש״ח למטר, וזה בדיוק מחיר הכניסה שאנחנו מציעים.", "E2.3": "נקודת יציאה שקופה ובטוחה עם התחייבות שלנו, שמצוינת בחוזה הקנייה.", "E2F": "את שלושתן אני פותח יחד איתך בפגישה, מסמך אחרי מסמך, ועונים על כל שאלה.", "E3H": "איפה הרווח בעסקה [[עומד היום]]", "E3S": "השלב שבו קרקעות נתקעות שנים, כבר מאחור. הבא בתור: תוכנית מפורטת למתחם.", "STAGES": "קרקע חקלאית: נקודת המוצא של כל קרקע, לפני שמתחיל תכנון.\nועדה ארצית: הקווים הגדולים של המדינה: איך והאם הרעיון יתרום לעתיד היישוב.\nועדה מחוזית: ב־18/12/2024 אושרה התוכנית הכוללנית של קדימה צורן, ומתחם H בתוכה.\nועדה מקומית (אנחנו כאן): כאן אנחנו היום. התכנון הגדול אושר ויורד לרמת המתחם.\nאישור תוכנית מפורטת: תוכנית מפורטת אחת לכל מתחם H: מה מניחים איפה. בשלב זה עסקאות קרקע דומות, מזוהות עם רווחים של עשרות ומאות אחוזים.\nאישור תוכנית פיתוח: כבישים, מים וניקוז. מתכוננים לשלבי הבנייה.\nזמינות לבנייה: מנופים, שופלים ודחפורים. משלמים לקבלן ובונים, או מוכרים ליזם ונהנים מההשבחה של התכנון.", "E4H": "קדימה צורן [[ומתחם H המרכזי]]", "E4P": "היישוב קדימה צורן מתוכנן להכפיל את עצמו, בזכות התוכנית הכוללנית המאושרת ותוכניות נוספות. היום גרים בו כ־23,000 תושבים על כ־11,000 דונם, שטח גדול פי 3 מגבעתיים, שבה גרים כ־60,000 תושבים.", "FACTS": "1,000 · יחידות דיור בשכונה החדשה\nכ־50,000 מ״ר · מרכז קניות פתוח\nעירוב שימושים · מגורים, דיור מוגן, מסחר ותעסוקה\nכ־10 ק״מ · מחוף הים, שוכנת בין כפר סבא לנתניה, קרובה לרעננה והרצליה.", "EXITH": "ומה אם [[ארצה לצאת?]]", "E5": "אפשר למכור בכל שלב! בנוסף אנו מספקים מודל שקוף וברור עם נקודות יציאה, הכל מגובה בכתב מצדנו, וכל התנאים כתובים מראש בחוזה. בפגישה עוברים עליהם יחד, סעיף אחרי סעיף.", "REVH": "״חיפשנו הרבה זמן [[מישהו שאפשר לסמוך עליו]] בתחום הנדל״ן״\nמתוך ביקורת בגוגל על קבוצת תום הרוש", "TOM.k": "מבינים אנשים. [[מומחים בנדל״ן.]]", "TOM.h": "אני שמח לראות אותך כאן.\n[[אני תום הרוש]]", "TOM.bio": "יותר מ־15 שנה אני בעולם הנדל״ן: השקעות, תיווך, יזמות והתחדשות עירונית. יחד עם השותפים שלי לאורך השנים יזמנו, הקמנו ומסרנו מעל 1,000 יחידות דיור.", " const PHONE = '053-302-5464', WORKER = 'https://tom-funnel.tom-harush.workers.dev', PIXEL_ID = '1002428386157716';
/* חלונות הזמן מהטקסט "שם · 09:00 עד 12:00", ומהם גם הניסוח במשפט ("בבוקר, בין 09:00 ל־12:00") */
const WKEYS = ['morning', 'noon', 'evening'];
let WINL = [], WINS = {};
function winsFrom(){
  WINL = TX['JWIN'].split('\n').map(l => { const p = l.split('·'); return [p[0].trim(), (p[1] || '').trim(), (p[2] || '').trim()]; });
  WINS = {};
  WKEYS.forEach((key, i) => { const [n, h] = WINL[i] || ['', '']; const hh = h.split(' עד '); WINS[key] = hh.length === 2 ? n + ', בין ' + hh[0] + ' ל־' + hh[1] : (n + ' ' + h).trim(); });
}
function glue(t){ if(!t) return t; t=String(t).replace(/(^|[\s\[])(ללא|בלי|לא|עם|של|על|את|כל|גם|רק|עד|לפי|כמו|אם|או|מול|בין|אל|כדי|זה) (?=\S)/g,'$1$2\u00a0'); return t.split('\n').map(function(l){ const i=l.lastIndexOf(' '); return i>0 ? l.slice(0,i)+'\u00a0'+l.slice(i+1) : l; }).join('\n'); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain = t => String(t || '').replace(/\[\[|\]\]|\{\{|\}\}/g, '');
const $ = id => document.getElementById(id);
const set = (el, t) => { if (el) el.textContent = glue(plain(t)); };
/* כותרות: [[...]] = צבע המותג, {{...}} = קופסה אדומה עם טקסט לבן */
const setH = (el, t) => { if (el) el.innerHTML = esc(glue(t)).replace(/\{\{(.+?)\}\}/g, '<span class="hlx">$1</span>').replace(/\[\[(.+?)\]\]/g, '<span class="hl">$1</span>').replace(/\n/g, '<br/>'); };
/* כיתובים: [[...]] = מודגש, ומספרים עם מקף נשארים בשורה אחת ומשמאל לימין */
const setB = (el, t) => { if (el) el.innerHTML = esc(glue(t)).replace(/\[\[(.+?)\]\]/g, '<b>$1</b>').replace(/(\d+(?:-\d+)+)/g, '<span dir="ltr" style="white-space:nowrap;unicode-bidi:isolate">$1</span>').replace(/\n/g, '<br/>'); };
function topQS(){ try{ return window.top.location.search || location.search; }catch(e){ return location.search; } }
const Q = new URLSearchParams(topQS());
const DEMO = Q.get('demo') === '1', LID = Q.get('lid') || '';
const num = (k, max, d) => { const v = parseInt(Q.get(k), 10); return (v >= 0 && v < max) ? v : d; };
const m = num('m', 4, 0), b = num('b', 3, 0), w = num('w', 3, 2), k = num('k', 3, 0);
const NAME = (Q.get('name') || '').trim().split(/\s+/)[0] || '';
function myPhone(){ try{ const a = JSON.parse(localStorage.getItem('th_leads') || '[]'); const r = a.slice().reverse().find(x => !LID || x.lead_id === LID); return r ? String(r.phone || '') : ''; }catch(e){ return ''; } }
function fmtPhone(p){ let d = String(p||'').replace(/\D/g,''); if (d.startsWith('972')) d = '0' + d.slice(3); return d.length === 10 ? d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6) : ''; }
function booked(){ if (DEMO) return WKEYS.includes(Q.get('cb')) ? Q.get('cb') : ''; try{ const c = JSON.parse(sessionStorage.getItem('b_cb') || '{}'); return WKEYS.includes(c.w) ? c.w : ''; }catch(e){ return ''; } }
const CB = booked();

const ICON = { ok:'<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7"/></svg>', ask:'?', honest:'!' };
const LBL = { ok:'מתאים', ask:'נסגר בשיחה', honest:'בודקים בכנות' };
const rows = [['R1.' + m, D.q1[m]], ['R2.' + m + '.' + b, D.q2[m][b]], ['R3.' + w, D.q3[w]], ['R4.' + k, D.q4[k]]];
const okN = rows.filter(r => ST[r[0]] === 'ok').length;
const ph = fmtPhone(myPhone());
const vcf = 'BEGIN:VCARD\nVERSION:3.0\nFN:קדימה צורן · מתחם H\nORG:קבוצת תום הרוש\nTEL;TYPE=CELL:+972' + PHONE.replace(/\D/g,'').replace(/^0/,'') + '\nEND:VCARD';
$('dSave').href = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcf);
function showBooked(win, n){
  $('cBooked').textContent = glue(TX['C.booked'].replace('{w}', WINS[win])); $('cBooked').hidden = false; $('ctaBox').hidden = true;
  const dp = TX['JDP'].split('\n'); set($('jDH'), dp[0]); set($('jDP'), (dp[1] || '').replace('{w}', WINS[win]).replace('{n}', n || 'שהזנת'));
  $('jform').hidden = true; $('jDone').hidden = false; window.__cbDone = true; $('float').classList.remove('on');
  $('pbar').classList.add('done'); set($('pbarT'), TX['TOP.done']); set($('pbarT2'), TX['TOP.done']);
  $('cWa').hidden = false; document.querySelectorAll('.mid-cta').forEach(x => { x.hidden = true; });
}

/* כל הטקסטים של הדף נכתבים כאן, וזה בטוח להריץ שוב: התצוגה המקדימה בארטיפקט הקופי מריצה את render אחרי כל עריכה.
   data-t = טקסט, data-th = כותרת עם צבע המותג, data-tb = כיתוב עם הדגשה, data-tq/tp = כרטיסי המחשבות, ALT.n h/p = כרטיסי החלופות */
function render(){
  winsFrom();
  document.querySelectorAll('[data-t]').forEach(el => {
    const id = el.getAttribute('data-t'), mm = id.match(/^(ALT\.\d)(h|p)$/);
    if (mm) { const t = plain(TX[mm[1]]); const i = t.indexOf(':'); set(el, mm[2] === 'h' ? t.slice(0, i) : t.slice(i + 1).trim()); return; }
    set(el, TX[id]);
  });
  $('jAlt').placeholder = plain(TX['JALT.ph']); $('jAlt').setAttribute('aria-label', plain(TX['JALT.ph']));
  document.querySelectorAll('[data-th]').forEach(el => setH(el, TX[el.getAttribute('data-th')]));
  document.querySelectorAll('[data-tb]').forEach(el => setB(el, TX[el.getAttribute('data-tb')]));
  document.querySelectorAll('[data-tw]').forEach(el => { const p = WINL[+el.getAttribute('data-tw')] || ['', '']; set(el.querySelector('.wn'), p[0]); set(el.querySelector('.wt'), p[1]); set(el.querySelector('.wm'), p[2] || ''); });
  const d = String(TX['DISC'] || ''), di = d.indexOf('.') + 1; $('fDisc').innerHTML = di > 0 ? '<b>' + esc(d.slice(0, di)) + '</b>' + esc(glue(d.slice(di))) : esc(glue(d));
  document.querySelectorAll('[data-tq]').forEach(el => set(el, TX[el.getAttribute('data-tq')].split('\n')[0]));
  document.querySelectorAll('[data-tp]').forEach(el => set(el, TX[el.getAttribute('data-tp')].split('\n').slice(1).join(' ')));

  /* 3. ציר הזמן: וי עד "(אנחנו כאן)", ואחריו מספרים */
  const jtl = document.querySelector('.jtl'); let seen = false;
  jtl.querySelectorAll('.jtl-item').forEach(x => x.remove());
  TX['STAGES'].split('\n').forEach((ln, i) => {
    const j = ln.indexOf(':'), here = ln.slice(0, j).includes('(אנחנו כאן)'), name = ln.slice(0, j).replace('(אנחנו כאן)', '').trim();
    const s = here ? 'here' : (seen ? 'next' : 'done'); seen = seen || here;
    const it = document.createElement('div'); it.className = 'jtl-item ' + s;
    it.innerHTML = '<div class="jtl-node">' + (s === 'done' ? ICON.ok : s === 'here' ? '<span class="herepulse"></span>' : String(i + 1)) + '</div><div class="jtl-card"><h4>' + esc(name) + (here ? '<span class="here-tag"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7" fill="none"/></svg>אנחנו כאן</span>' : '') + '</h4><p>' + esc(glue(ln.slice(j + 1).trim())) + '</p></div>';
    jtl.appendChild(it);
  });

  /* 1. התוצאה: הבר (מלא אצל מי שכבר בחר מועד, ב־showBooked), הכותרת והכרטיס */
  set($('pbarT'), TX['TOP.bar']); set($('pbarT2'), TX['TOP.bar']);
  const hw = TX['H.w' + w];
  setH($('hH'), NAME ? hw.replace('{שם}', NAME) : hw.replace(/^\{שם\},\s*/, ''));
  const sum = (okN === 4 ? TX['C.sum4'] : TX['C.sumN'].replace('{n}', okN)).split('\n');
  setH($('cS'), sum[0]); setH($('cN'), sum.slice(1).join(' ')); $('cN').hidden = sum.length < 2;
  $('pts').innerHTML = '';
  rows.forEach(r => {
    const s = ST[r[0]] || 'ok', li = document.createElement('li'); li.setAttribute('data-id', r[0]);
    li.innerHTML = '<span class="rc-ic ' + s + '" role="img" aria-label="' + LBL[s] + '">' + ICON[s] + '</span><div><span class="rc-nd"></span><span class="rc-an"></span></div>';
    set(li.querySelector('.rc-nd'), TX['C.mark'] + ' ' + r[1][0]); set(li.querySelector('.rc-an'), TX[r[0]]);
    $('pts').appendChild(li);
  });
  const lo = document.createElement('li'); lo.className = 'open';
  lo.innerHTML = '<span class="rc-ic ask" aria-hidden="true">?</span><div><span class="rc-an"></span></div>'; set(lo.querySelector('.rc-an'), TX['R5']); $('pts').appendChild(lo);
  const np = String(TX['C.num'] || '').split('·'); $('cNum').innerHTML = esc(glue(np[0].trim())).replace(/(0\d{1,2}-\d{3}-\d{4})/, '<b>$1</b>'); set($('dSave'), (np[1] || '').trim());

  /* 9-12 */
  const rq = TX['REVH'].split('\n'); setH($('eRevH'), rq[0]); set($('eRevS'), rq[1] || '');
  $('tVals').innerHTML = TX['TOM.values'].split('·').map(v => '<span>' + esc(v.trim()) + '</span>').join('');
  $('eFacts').innerHTML = TX['FACTS'].split('\n').map(l => { const p = l.split('·'); return '<div class="t"><div class="v">' + esc(p[0].trim()) + '</div><div class="l">' + esc(glue((p[1] || '').trim())) + '</div></div>'; }).join('');
  $('faqs').innerHTML = ['FAQ.1','FAQ.2','FAQ.3','FAQ.4','FAQ.5'].map((id, i) => { const p = TX[id].split('\n'); return '<details' + (i === 0 ? ' open' : '') + '><summary>' + esc(p[0]) + ' <span class="pl">+</span></summary><div class="a">' + esc(glue(p.slice(1).join('\n'))) + '</div></details>'; }).join('');

  /* 11. בורר המועד: לפי שאלה 3, וזוכר מועד שכבר נבחר */
  set($('jL'), w === 1 ? TX['JL.w1'] : TX['JL']);
  if (ph) { $('jMy').innerHTML = esc(glue(TX['JMY'])).replace(/\{(\d)[\s\u00a0]ספרות\}/, (x, d) => '<b>' + ph.slice(-d) + '</b>'); $('jMy').hidden = false; }
  document.title = plain(TX['META.title']);
  if (CB) showBooked(CB, ph);
}
render();
function validPhone(p){ let d=(p||'').replace(/\D/g,''); if(d.startsWith('972')) d='0'+d.slice(3); return /^05\d{8}$/.test(d); }
/* שתי תיבות הסימון: אחת חובה, לא שתיהן יחד. השנייה פותחת את שדה הטלפון */
function syncAlt(){ $('jAltBox').hidden = !$('jOk2').checked; }
$('jOk').addEventListener('change', () => { if ($('jOk').checked) $('jOk2').checked = false; syncAlt(); $('jEo').textContent = ''; });
$('jOk2').addEventListener('change', () => { if ($('jOk2').checked) $('jOk').checked = false; syncAlt(); $('jEo').textContent = ''; if ($('jOk2').checked) $('jAlt').focus(); });
$('jform').addEventListener('submit', async e => {
  e.preventDefault();
  const win = (document.querySelector('input[name="w"]:checked') || {}).value || '', useAlt = $('jOk2').checked, alt = useAlt ? $('jAlt').value.trim() : '';
  $('jEw').textContent = ''; $('jEo').textContent = '';
  let ok = true;
  if (!win) { $('jEw').textContent = TX['JERR']; ok = false; }
  if (!$('jOk').checked && !useAlt) { $('jEo').textContent = TX['JERR.ok']; ok = false; }
  else if (useAlt && !validPhone(alt)) { $('jEo').textContent = TX['JERR.alt']; ok = false; }
  if (!ok) { (!win ? $('w1') : (!$('jOk').checked && !useAlt) ? $('jOk') : $('jAlt')).focus(); return; }
  const n = fmtPhone(alt) || ph;
  if (DEMO || !LID) { showBooked(win, n); return; }   /* דמו: לא שולחים ולא עוברים לדף התודה */
  $('jBtn').disabled = true; $('jCta').textContent = TX['JSAVING'];
  const body = JSON.stringify({ lead_id: LID, window: win, alt_phone: alt || '', confirmed: true, at: new Date().toISOString() });
  let sent = false;
  try { const r = await fetch(WORKER + '/callback', { method:'POST', keepalive:true, headers:{'Content-Type':'application/json'}, body }); sent = r.ok; } catch(err) {}
  if (!sent) { try { navigator.sendBeacon && navigator.sendBeacon(WORKER + '/callback', new Blob([body], {type:'text/plain;charset=UTF-8'})); } catch(err) {} }
  try { sessionStorage.setItem('b_cb', JSON.stringify({ w: win, alt: alt || '', at: Date.now() })); } catch(err) {}
  showBooked(win, n);
  const tq = new URLSearchParams({ w: win }); if (LID) tq.set('lid', LID);
  setTimeout(() => { try { window.top.location.href = '/b/t/?' + tq.toString(); } catch(err) { location.href = '/b/t/?' + tq.toString(); } }, 350);
});
try { sessionStorage.setItem('b_res', location.pathname + location.search); } catch(e) {}

/* סרגל הדמו */
if (DEMO) {
  const mk = (lbl, key, opts, cur) => '<label>' + lbl + ' <select data-k="' + key + '">' + opts.map((o, i) => '<option value="' + i + '"' + (i === cur ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select></label>';
  $('demoIn').innerHTML = '<b>דמו: מחליפים תשובות ורואים את הדף של כל ליד</b><label>שם <input data-k="name" value="' + esc(NAME || 'דנה') + '"/></label>' +
    mk('שאלה 1', 'm', D.q1.map(o => o[0]), m) + mk('שאלה 2', 'b', D.q2[m].map(o => o[0]), b) + mk('שאלה 3', 'w', D.q3.map(o => o[0]), w) + mk('שאלה 4', 'k', D.q4.map(o => o[0]), k) +
    '<label>מועד <select data-k="cb"><option value="">עוד לא בחר</option>' + ['morning','noon','evening'].map((x, i) => '<option value="' + x + '"' + (CB === x ? ' selected' : '') + '>' + ['בוקר','צהריים','ערב'][i] + '</option>').join('') + '</select></label>';
  $('demo').hidden = false;
  $('demoIn').addEventListener('change', e => { const p = new URLSearchParams(location.search); const kk = e.target.getAttribute('data-k'); p.set(kk, e.target.value); if (kk === 'm') p.set('b', '0'); if (!e.target.value) p.delete(kk); p.set('demo', '1'); location.search = p.toString(); });
}

/* ההירו בטלפון: התמונה נגמרת קצת אחרי ראש הכרטיס, ולכן ממורכזת על מה שרואים. בר ההתקדמות: רוחב לשכבת הטקסט הלבן */
function sizeHero(){
  const bg = document.querySelector('.rh-bg'), rh = document.querySelector('.rh');
  $('pbar').style.setProperty('--bw', $('pbar').offsetWidth + 'px');
  if (matchMedia('(min-width:960px)').matches) { bg.style.height = ''; bg.style.bottom = ''; return; }
  bg.style.bottom = 'auto'; bg.style.height = Math.round($('res').getBoundingClientRect().top - rh.getBoundingClientRect().top + 72) + 'px';
}
sizeHero(); addEventListener('resize', sizeHero); addEventListener('load', sizeHero);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeHero);

/* לייטבוקס לביקורות: חצים, החלקה, מקלדת, X גדול. "חזרה" בטלפון סוגרת את הלייטבוקס ולא יוצאת מהדף */
(function(){
  const imgs = [...document.querySelectorAll('.rgal .rev')], lb = $('rlb'), im = $('rlbImg'); let i = 0, pushed = false, x0 = null;
  function show(n){ i = (n + imgs.length) % imgs.length; im.src = imgs[i].src; im.alt = imgs[i].alt; $('rlbN').textContent = (i + 1) + ' / ' + imgs.length; }
  function open(n){ show(n); lb.hidden = false; document.body.style.overflow = 'hidden'; try { history.pushState({ rlb: 1 }, ''); pushed = true; } catch(e) {} $('rlbX').focus(); }
  function close(fromPop){ if (lb.hidden) return; lb.hidden = true; document.body.style.overflow = ''; const back = pushed && !fromPop; pushed = false; if (back) { try { history.back(); } catch(e) {} } }
  imgs.forEach((el, n) => { el.setAttribute('tabindex', '0'); el.setAttribute('role', 'button'); el.addEventListener('click', () => open(n)); el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(n); } }); });
  $('rlbX').addEventListener('click', () => close());
  $('rlbNext').addEventListener('click', () => show(i + 1)); $('rlbPrev').addEventListener('click', () => show(i - 1));
  lb.addEventListener('click', e => { if (e.target === lb || e.target === $('rlbSt')) close(); });
  addEventListener('keydown', e => { if (lb.hidden) return; if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') show(i + 1); else if (e.key === 'ArrowRight') show(i - 1); });
  addEventListener('popstate', () => close(true));
  lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive:true });
  lb.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 45) show(dx > 0 ? i + 1 : i - 1); }, { passive:true });
})();

/* פיקסל ומדידה: לא בדמו */
if (!DEMO) {
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', PIXEL_ID); fbq('track', 'PageView'); fbq('track', 'ViewContent', { content_name:'b_page', variant:'b' });
  const s = document.createElement('script'); s.src = '/track.js'; s.defer = true; document.body.appendChild(s);
}

/* תנועה: חשיפה בגלילה, ציר JET, כפתור צף, עוד ביקורות */
function scrollJoin(e){ if(e) e.preventDefault(); $('join').scrollIntoView({behavior:'smooth', block:'start'}); }
const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } }), {threshold:.12});
document.querySelectorAll('.rv').forEach(el => io.observe(el));
function initJet(el){
  const fill = el.querySelector('.jtl-fill');
  function upd(){
    const items = [...el.querySelectorAll('.jtl-item')], here = el.querySelector('.jtl-item.here .jtl-node');
    const r = el.getBoundingClientRect(), center = innerHeight * .6;
    const stop = here ? (here.getBoundingClientRect().top - r.top + 23) : el.offsetHeight;
    fill.style.height = Math.min(Math.max(center - r.top, 0), stop) + 'px';
    items.forEach(it => { const nr = it.querySelector('.jtl-node').getBoundingClientRect(); it.classList.toggle('on', nr.top < center); });
  }
  addEventListener('scroll', upd, {passive:true}); addEventListener('resize', upd); upd();
}
document.querySelectorAll('[data-jet]').forEach(initJet);
const fl = $('float'), res = $('res'), join = $('join');
addEventListener('scroll', () => {
  const past = res.getBoundingClientRect().bottom < 0, before = join.getBoundingClientRect().top > innerHeight * .9;
  fl.classList.toggle('on', past && before && !window.__cbDone);
}, {passive:true});
